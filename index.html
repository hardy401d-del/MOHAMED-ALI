<h4>1. Une distinction fondamentale, souvent négligée à tort</h4>
<p>Le droit pénal malgache distingue traditionnellement trois catégories d'infractions selon leur gravité : le <b>crime</b>, le <b>délit</b> et la <b>contravention</b>. Cette classification n'est pas un simple exercice de vocabulaire : elle commande la juridiction compétente, le régime de la tentative, et les délais de prescription — trois pièges classiques à l'écrit.</p>

<h4>2. Les conséquences pratiques de la classification</h4>
<ul>
  <li><b>La juridiction compétente</b> : les crimes relèvent de la Cour criminelle, les délits du tribunal correctionnel, les contraventions du tribunal de police. Le Code de procédure pénale organise cette répartition (dispositions relatives à la compétence des juridictions répressives, notamment les articles 18, 25 et 27, à revérifier avant l'écrit pour l'attribution précise).</li>
  <li><b>La tentative</b> : la tentative de crime est en principe toujours punissable ; la tentative de délit ne l'est que si un texte le prévoit expressément ; la tentative de contravention n'est en principe jamais punissable.</li>
  <li><b>La prescription de l'action publique</b> : les délais sont échelonnés selon la gravité — plus longs pour les crimes, plus courts pour les délits, très brefs pour les contraventions. Les durées précises restent à vérifier avant l'écrit (elles varient aussi selon la nature de l'infraction, par exemple pour les infractions imprescriptibles).</li>
</ul>

<h4>3. Comment reconnaître la catégorie d'une infraction</h4>
<p>Le critère n'est pas la gravité « ressentie » des faits mais la <b>peine encourue</b> telle que fixée par le texte d'incrimination : peine criminelle (ex. travaux forcés, réclusion) pour un crime, peine correctionnelle (emprisonnement) pour un délit, peine de police (amende, faible emprisonnement) pour une contravention.</p>
<div style="background:var(--surface-2); padding:10px 12px; border-radius:3px; margin:10px 0; border-left:2px solid var(--gold);">
  <p style="font-size:12.5px; color:var(--muted);"><b>Point de vigilance :</b> le principe de la classification tripartite (crime/délit/contravention) et ses trois conséquences (juridiction, tentative, prescription) sont solides et classiques en droit pénal malgache. En revanche, je n'ai pas pu vérifier avec une certitude suffisante les numéros exacts d'articles du Code pénal ou du Code de procédure pénale malgache pour chaque seuil précis (montant des amendes, durées exactes de prescription) — à confirmer avant l'écrit plutôt que de citer un chiffre non vérifié.</p>
</div>

<h4>4. Le Réflexe Rédactionnel du Magistrat</h4>
<div style="background:var(--surface-2); padding:12px; border-radius:3px; margin:10px 0;">
  <p><b>❌ À BANNIR :</b> "C'est un crime parce que c'est grave."</p>
  <p><b>✅ FORMULATION ATTENDUE :</b> "L'infraction relève de la catégorie des crimes dès lors que le texte d'incrimination prévoit une peine criminelle, ce qui commande la compétence de la Cour criminelle et le caractère punissable de sa tentative."</p>
</div>

<h4>Application : Le Piège du Jour</h4>
<div style="background:var(--surface-2); padding:12px; border-radius:3px; margin:10px 0;">
  <p><b>Cas :</b> Rakoto a tenté, sans succès, de commettre un vol simple (délit) puis, le même jour, une contravention de tapage nocturne inachevée faute de circonstances. Les deux tentatives sont-elles punissables ?</p>
  <p><b>Correction :</b> Il faut distinguer. La <b>tentative de vol</b> (délit) n'est punissable que si un texte le prévoit expressément pour ce délit précis — ce qui est le cas pour le vol en droit pénal classique. La <b>tentative de contravention</b>, en revanche, n'est en principe <b>jamais punissable</b>, quel que soit le texte. Le piège : appliquer machinalement aux contraventions le même raisonnement que pour les délits ou les crimes.</p>

    contenu_cours: `
<h4>1. Un thème directement lié à la fonction de magistrat</h4>
<p>Sujet particulièrement pertinent pour un futur magistrat malgache : la lutte anti-corruption est structurée par la <b>Loi n°2016-020 du 22 août 2016</b> sur la lutte contre la corruption, qui a réformé le dispositif antérieur, et par la <b>Loi n°2004-030 du 9 septembre 2004</b> sur la lutte contre la corruption, dont l'<b>article 18</b> a créé le <b>BIANCO</b> (Bureau Indépendant Anti-Corruption).</p>

<h4>2. Le dispositif institutionnel malgache anti-corruption</h4>
<ul>
  <li><b>Le BIANCO</b> : organe d'enquête indépendant chargé de la détection et de l'investigation des faits de corruption.</li>
  <li><b>Le CSI</b> (Comité de Sauvegarde de l'Intégrité) : organe de pilotage stratégique de la politique nationale anti-corruption.</li>
  <li><b>SAMIFIN</b> : Service de Renseignements Financiers, chargé de la lutte contre le blanchiment de capitaux souvent lié à la corruption.</li>
  <li><b>Le PAC</b> (Pôle Anti-Corruption) : juridiction spécialisée compétente pour juger les infractions de corruption et infractions assimilées.</li>
</ul>

<h4>3. Les infractions typiques</h4>
<ul>
  <li><b>La corruption passive</b> : le fait, pour un agent public, de solliciter ou d'agréer un avantage indu pour accomplir ou s'abstenir d'accomplir un acte de sa fonction.</li>
  <li><b>La corruption active</b> : le fait, pour toute personne, de proposer ou d'octroyer un tel avantage à un agent public.</li>
  <li><b>La prise illégale d'intérêts</b> : le fait, pour un agent public, de prendre, recevoir ou conserver un intérêt dans une entreprise ou une opération dont il a, au moment de l'acte, la charge d'assurer la surveillance, l'administration ou le contrôle — sans qu'il soit nécessaire de prouver une contrepartie ou un enrichissement personnel, contrairement à la corruption.</li>
</ul>
<div style="background:var(--surface-2); padding:10px 12px; border-radius:3px; margin:10px 0; border-left:2px solid var(--gold);">
  <p style="font-size:12.5px; color:var(--muted);"><b>Point de vigilance :</b> l'existence des lois n°2016-020 et n°2004-030, ainsi que la création du BIANCO par l'article 18 de cette dernière, sont corroborées par plusieurs sources indépendantes. En revanche, je n'ai pas pu vérifier les numéros précis des articles d'incrimination (corruption active/passive, prise illégale d'intérêts) au sein de ces textes ni les peines encourues — à confirmer avant l'écrit, sans jamais citer un chiffre non vérifié.</p>
</div>

<h4>4. Le point de distinction clé : prise illégale d'intérêts vs corruption</h4>
<p>Le piège classique : la prise illégale d'intérêts <b>ne suppose aucune contrepartie</b> — c'est une infraction de <b>pur conflit d'intérêts</b>, consommée par le seul fait de se trouver en situation d'intérêt, même sans en tirer un avantage personnel matériel. La corruption, elle, suppose un échange (avantage contre acte ou abstention).</p>

<h4>5. Le Réflexe Rédactionnel du Magistrat</h4>
<div style="background:var(--surface-2); padding:12px; border-radius:3px; margin:10px 0;">
  <p><b>❌ À BANNIR :</b> "Il a favorisé une entreprise, donc c'est de la corruption."</p>
  <p><b>✅ FORMULATION ATTENDUE :</b> "En l'absence de preuve d'un avantage indu octroyé en contrepartie de l'acte, la qualification de corruption ne saurait être retenue ; les faits sont, en revanche, susceptibles de caractériser une prise illégale d'intérêts, infraction qui ne requiert la preuve d'aucune contrepartie."</p>
</div>

<h4>Application : Le Piège du Jour</h4>
<div style="background:var(--surface-2); padding:12px; border-radius:3px; margin:10px 0;">
  <p><b>Cas :</b> Un responsable des marchés publics au sein d'une commune attribue, sans aucune contrepartie ni enrichissement personnel prouvé, un marché de construction à une entreprise dont son épouse est actionnaire, sans se déporter du dossier. Peut-on le poursuivre en l'absence de preuve d'un pot-de-vin ?</p>
  <p><b>Correction :</b> Oui. Le piège est de croire qu'il faut prouver un enrichissement ou un avantage reçu pour poursuivre. Ici, l'infraction pertinente est la <b>prise illégale d'intérêts</b> : le responsable avait la charge de la surveillance/administration du marché et détenait, via son épouse, un intérêt dans l'entreprise attributaire — l'infraction est consommée indépendamment de toute preuve de contrepartie ou d'enrichissement personnel.</p>
</div>

    contenu_cours: `
<h4>1. Le fondement légal : le Titre VIII du Code de commerce malgache</h4>
<p>Le <b>Titre VIII</b> du Code de commerce malgache, « De la lettre de change et du billet à ordre », trouve son origine dans le <b>décret-loi du 30 octobre 1935</b> unifiant le droit en matière de lettre de change et de billet à ordre, rendu applicable à Madagascar par décret du 18 décembre 1936. Le chèque, lui, relève d'un texte distinct : le <b>décret-loi du 30 octobre 1935 unifiant le droit en matière de chèque</b>, rendu applicable par décret du 18 décembre 1935, modifié notamment par l'<b>Ordonnance n°72-041</b> sur la prévention et la répression des infractions en matière de chèques.</p>

<h4>2. La lettre de change</h4>
<p>Écrit par lequel une personne (<b>le tireur</b>) donne l'ordre à une autre (<b>le tiré</b>) de payer une somme déterminée, à une date fixée, à un tiers ou à son ordre (<b>le bénéficiaire</b>). C'est à la fois un instrument de paiement et de crédit : le bénéficiaire peut l'endosser au profit d'un créancier, ou l'escompter auprès d'une banque pour obtenir des fonds avant l'échéance.</p>

<h4>3. Le billet à ordre</h4>
<p>À la différence de la lettre de change (qui met en jeu trois personnes), le billet à ordre n'en implique que deux : le <b>souscripteur</b>, qui s'engage lui-même à payer une somme déterminée à une date fixée au <b>bénéficiaire</b> ou à son ordre. Les règles de la lettre de change lui sont largement applicables par renvoi, dans la mesure où elles sont compatibles avec sa nature (endossement, aval, protêt, recours cambiaires).</p>

<h4>4. Le chèque</h4>
<p>Instrument de <b>paiement à vue</b> (et non de crédit, contrairement à la lettre de change) : le tireur donne l'ordre à sa banque (<b>le tiré</b>) de payer une somme au bénéficiaire, sur present­ation immédiate. En cas de non-paiement, un <b>protêt faute de paiement</b> peut être dressé — l'article 29 du décret-loi sur le chèque, modifié par l'article 11 de l'ordonnance n°72-041, fixe un délai de 8 jours pour la notification du protêt lorsque le chèque est émis et payable à Madagascar.</p>
<div style="background:var(--surface-2); padding:10px 12px; border-radius:3px; margin:10px 0; border-left:2px solid var(--gold);">
  <p style="font-size:12.5px; color:var(--muted);"><b>Point de vigilance :</b> l'architecture générale (décrets-lois de 1935, Titre VIII du Code de commerce, délai de 8 jours pour le protêt de chèque) est corroborée par plusieurs sources indépendantes (droit-afrique.com, Lexxika). Les numéros précis des articles internes à la lettre de change et au billet à ordre restent à vérifier dans le texte consolidé avant citation exacte à l'écrit.</p>
</div>

<h4>5. Le Réflexe Rédactionnel du Magistrat</h4>
<div style="background:var(--surface-2); padding:12px; border-radius:3px; margin:10px 0;">
  <p><b>❌ À BANNIR :</b> "Il a fait un chèque qui ne marchait pas, donc c'est comme s'il n'avait pas payé."</p>
  <p><b>✅ FORMULATION ATTENDUE :</b> "Le défaut de provision du chèque autorise le porteur à faire dresser protêt faute de paiement dans le délai imparti, sans préjudice des sanctions pénales spécifiques prévues en matière d'émission de chèque sans provision."</p>
</div>

<h4>Application : Le Piège du Jour</h4>
<div style="background:var(--surface-2); padding:12px; border-radius:3px; margin:10px 0;">
  <p><b>Cas :</b> Une entreprise reçoit en paiement un billet à ordre. Elle veut l'endosser au profit de sa banque pour obtenir des fonds immédiatement, avant l'échéance. Est-ce juridiquement possible, sachant qu'il ne s'agit pas d'une lettre de change ?</p>
  <p><b>Correction :</b> Oui. Le piège est de croire que seule la lettre de change permet l'endossement et l'escompte. Or les règles de la lettre de change relatives à l'endossement s'appliquent, par renvoi, au billet à ordre, dans la mesure où elles ne sont pas incompatibles avec sa nature à deux personnages (souscripteur/bénéficiaire) au lieu de trois. L'entreprise peut donc bien l'endosser au profit de sa banque pour un escompte.</p>
</div>

    contenu_cours: `
<h4>1. Le fondement légal : la Loi n°2003-042 sur les procédures collectives d'apurement du passif</h4>
<p>Madagascar n'étant <b>pas membre de l'OHADA</b> (rappel important, déjà signalé ailleurs dans cette bibliothèque), les procédures collectives ne sont pas régies par l'Acte uniforme OHADA mais par un texte propre : la <b>Loi n°2003-042</b>, qui constitue le livre troisième du Code de commerce malgache. Elle organise trois mécanismes : le <b>règlement préventif</b>, le <b>redressement judiciaire</b> et la <b>liquidation des biens</b>.</p>

<h4>2. La compétence : le tribunal de commerce</h4>
<p>L'<b>article 4</b> de la loi attribue au <b>tribunal de commerce</b> la compétence pour connaître du règlement préventif, du redressement judiciaire et de la liquidation des biens, ainsi que de toutes les contestations nées de la procédure collective.</p>

<h4>3. L'ouverture : la cessation des paiements</h4>
<p>L'<b>article 11</b> impose au débiteur qui ne peut plus faire face à son passif exigible avec son actif disponible de faire une <b>déclaration de cessation des paiements</b>, afin d'obtenir l'ouverture d'une procédure de redressement judiciaire ou de liquidation des biens. Le redressement judiciaire et la liquidation des biens s'appliquent à toute personne physique ou morale commerçante, ainsi qu'à toute personne morale de droit privé non commerçante.</p>

<h4>4. Le règlement préventif</h4>
<p>Procédure amiable, non contentieuse, destinée à prévenir la cessation des paiements par un accord entre le débiteur et ses créanciers, homologué par le tribunal, sous l'assistance d'un conciliateur désigné par le tribunal de commerce. Selon l'<b>article 10</b>, cet accord suspend, pendant la durée de son exécution, toute action en justice et toute poursuite individuelle des créanciers concernés.</p>

<h4>5. Le redressement et la liquidation</h4>
<p>Ces deux procédures, régies par le Titre II de la loi (<b>articles 11 à 224</b>), interviennent en cas de cessation des paiements avérée. Le débiteur, secondé par un <b>syndic</b> désigné par le tribunal (personne chargée d'assister le dirigeant et de représenter les créanciers), peut proposer un <b>concordat de redressement</b> — plan exposant les mesures envisagées pour éviter la liquidation. À défaut de concordat viable, le redressement est converti en liquidation des biens.</p>
<div style="background:var(--surface-2); padding:10px 12px; border-radius:3px; margin:10px 0; border-left:2px solid var(--gold);">

</div>

<h4>6. Le Réflexe Rédactionnel du Magistrat</h4>
<div style="background:var(--surface-2); padding:12px; border-radius:3px; margin:10px 0;">
  <p><b>❌ À BANNIR :</b> "L'entreprise n'a plus d'argent, donc c'est la faillite."</p>
  <p><b>✅ FORMULATION ATTENDUE :</b> "L'impossibilité pour le débiteur de faire face à son passif exigible avec son actif disponible caractérise la cessation des paiements au sens de l'article 11 de la Loi n°2003-042, ouvrant la voie à une procédure de redressement judiciaire ou, à défaut de perspective de redressement, à la liquidation des biens."</p>
</div>

<h4>Application : Le Piège du Jour</h4>
<div style="background:var(--surface-2); padding:12px; border-radius:3px; margin:10px 0;">
  <p><b>Cas :</b> Le dirigeant d'une société malgache en difficulté invoque, à l'appui de sa demande d'ouverture d'une procédure collective, une référence à l'Acte uniforme OHADA portant procédures collectives d'apurement du passif. Le tribunal doit-il l'appliquer ?</p>
  <p><b>Correction :</b> Non. Le piège classique : Madagascar <b>n'est pas membre de l'OHADA</b> — le droit applicable est exclusivement la <b>Loi n°2003-042</b> malgache, propre au pays, et non l'Acte uniforme OHADA (qui ne s'applique qu'aux 17 États membres de l'organisation). Le tribunal doit écarter toute référence à l'OHADA et appliquer le texte national.</p>
</div>

    contenu_cours: `
<h4>1. Un thème central pour un futur magistrat</h4>
<p>La présomption d'innocence et l'usage de la détention préventive constituent un sujet de dissertation classique en culture générale, car il met en tension deux impératifs : la protection de la société et de l'instruction, et le respect des droits fondamentaux de la personne poursuivie.</p>

<h4>2. Le cadre juridique malgache</h4>
<p>L'<b>article 13, alinéa 8, de la Constitution</b> du 17 novembre 2010 dispose que « tout prévenu ou accusé a droit à la présomption d'innocence jusqu'à ce que sa culpabilité ait été établie ». L'<b>alinéa 9</b> du même article ajoute que « la détention préventive est une exception » — un principe repris à l'<b>article 333</b> du Code de procédure pénale, qui précise qu'elle n'est pas applicable aux individus poursuivis pour des faits punis de peines de simple police ou de peines correctionnelles autres que l'emprisonnement. L'<b>article 334</b> encadre la durée de la détention préventive.</p>

<h4>3. La tension avec la pratique</h4>
<p>Plusieurs observateurs (dont des organisations de défense des droits humains) ont relevé, à certaines périodes de l'histoire judiciaire malgache, un usage plus systématique qu'exceptionnel de la détention préventive — notamment en période de crise politique, ce qui a nourri des critiques sur l'effectivité réelle du principe posé par la Constitution.</p>

<h4>4. Les enjeux à mobiliser dans une dissertation</h4>
<ul>
  <li><b>Argument en faveur d'un usage restrictif</b> : la présomption d'innocence est un droit fondamental ; la détention avant jugement inflige une peine anticipée à une personne non encore condamnée ; le risque d'erreur judiciaire est aggravé par une détention prolongée.</li>
  <li><b>Argument en faveur d'un usage encadré mais nécessaire</b> : nécessité d'éviter la fuite, les pressions sur les témoins, ou la réitération de l'infraction ; protection de l'ordre public le temps de l'instruction.</li>
  <li><b>La voie de conciliation</b> : le contrôle judiciaire (alternative à la détention), le raccourcissement des délais d'instruction, et le contrôle effectif de la motivation des décisions de placement en détention.</li>
</ul>
<div style="background:var(--surface-2); padding:10px 12px; border-radius:3px; margin:10px 0; border-left:2px solid var(--gold);">
  <p style="font-size:12.5px; color:var(--muted);"><b>Point de vigilance :</b> les articles 13 (Constitution) et 333/334 (Code de procédure pénale) sont corroborés par plusieurs sources indépendantes. Les appréciations sur la pratique effective (usage plus ou moins systématique) relèvent de constats généraux à nuancer et actualiser selon la période visée par le sujet — ne les présente jamais comme des données chiffrées précises sans les avoir vérifiées.</p>
</div>

<h4>5. Une accroche possible</h4>
<div style="background:var(--surface-2); padding:12px; border-radius:3px; margin:10px 0;">
  <p><b>Accroche :</b> "La Constitution malgache proclame que la détention préventive est une exception ; mais une exception que l'on prononce quotidiennement cesse-t-elle d'en être une ?"</p>
</div>

<h4>1. Un thème d'actualité permanente à Madagascar</h4>
<p>La corruption figure parmi les sujets de dissertation les plus probables : elle touche à la fois à l'économie, à la gouvernance, à la confiance des citoyens envers les institutions, et à la magistrature elle-même — d'où sa pertinence directe pour un futur magistrat.</p>

<h4>2. Le dispositif institutionnel malgache (à recouper avec le cours de droit pénal spécial sur la corruption)</h4>
<p>Madagascar s'est doté d'un dispositif anti-corruption structuré autour du <b>BIANCO</b> (Bureau Indépendant Anti-Corruption, créé par l'article 18 de la Loi n°2004-030), du <b>CSI</b> (Comité de Sauvegarde de l'Intégrité), du <b>SAMIFIN</b> (renseignement financier) et du <b>Pôle Anti-Corruption</b> (juridiction spécialisée). La <b>Loi n°2016-020</b> a réformé et renforcé ce dispositif.</p>

<h4>3. Les enjeux à mobiliser dans une dissertation</h4>
<ul>
  <li><b>La corruption comme frein au développement</b> : détournement de ressources publiques, découragement de l'investissement, aggravation des inégalités d'accès aux services publics.</li>
  <li><b>La corruption comme érosion de la confiance démocratique</b> : quand les citoyens perçoivent l'impunité des puissants, c'est la légitimité de l'État de droit tout entier qui est fragilisée.</li>
  <li><b>La difficulté de la preuve</b> : infraction souvent occulte, nécessitant des moyens d'investigation spécialisés (d'où la création d'organes dédiés comme le BIANCO).</li>

<h4>4. Une accroche possible</h4>
<div style="background:var(--surface-2); padding:12px; border-radius:3px; margin:10px 0;">

<h4>1. Pourquoi ce thème est un classique de dissertation</h4>
<p>Un droit qui ne peut être ni connu, ni revendiqué devant un juge accessible reste un droit théorique. L'accès à la justice est donc une condition de l'effectivité de tous les autres droits — un angle d'attaque efficace pour de nombreux sujets de culture générale.</p>

<h4>2. Les obstacles classiques à l'accès à la justice</h4>
<ul>
  <li><b>L'obstacle géographique</b> : l'éloignement des juridictions dans un pays à la géographie contraignante comme Madagascar, où de nombreuses zones rurales sont difficiles d'accès.</li>
  <li><b>L'obstacle financier</b> : le coût de la procédure (frais de justice, honoraires d'avocat) peut dissuader les justiciables les plus modestes.</li>
  <li><b>L'obstacle culturel et informationnel</b> : la méconnaissance des droits et des voies de recours, en particulier en zone rurale, favorise le recours à des modes de règlement extra-judiciaires (médiation traditionnelle, dina) qui coexistent avec la justice étatique.</li>
  <li><b>L'obstacle temporel</b> : la lenteur des procédures peut décourager le justiciable ou vider la décision de son utilité pratique.</li>
</ul>

<h4>3. Les réponses possibles</h4>
<ul>
  <li><b>L'aide juridictionnelle</b> : mécanisme de prise en charge, au moins partielle, des frais de justice pour les justiciables sans ressources suffisantes.</li>
  <li><b>La déconcentration/décentralisation judiciaire</b> : multiplication et rapprochement des juridictions du justiciable.</li>
  <li><b>La médiation et les modes alternatifs de règlement des différends (MARD)</b> : désengorger les tribunaux tout en offrant une réponse plus rapide, en particulier pour les litiges de faible enjeu.</li>
  <li><b>La numérisation de la justice</b> : simplification des démarches, suivi des procédures à distance.</li>
</ul>
<div style="background:var(--surface-2); padding:10px 12px; border-radius:3px; margin:10px 0; border-left:2px solid var(--gold);">

</div>

<h4>4. Une accroche possible</h4>
<div style="background:var(--surface-2); padding:12px; border-radius:3px; margin:10px 0;">
  <p><b>Accroche :</b> "La justice, disait-on, est rendue au nom du peuple — encore faut-il que le peuple puisse en franchir la porte."</p>
</div>

    contenu_cours: `
<h4>1. Le fondement légal : la Loi n°2024-014 du 14 août 2024</h4>
<p>Sujet classique de cas pratique, absent des cours existants sur cette matière (qui ne traitaient que le licenciement pour motif personnel). L'<b>article 44</b> du nouveau Code du travail définit le licenciement pour motif économique comme celui provoqué par des <b>difficultés économiques</b>, des <b>mutations technologiques</b> ou des <b>motifs d'organisation</b> entraînant une suppression de poste. Il peut être <b>collectif</b> ou <b>individuel</b>.</p>

<h4>2. La procédure — un piège classique</h4>
<p>L'<b>article 45</b> impose une procédure stricte, souvent source de pièges à l'écrit si elle est bâclée dans un cas pratique :</p>
<ul>
  <li>Consultation préalable du <b>comité d'entreprise</b> et/ou, à défaut, des <b>délégués du personnel</b>, avec transmission des motifs, de la situation financière, du plan de redressement projeté et de la liste du personnel concerné.</li>
  <li>Établissement d'un <b>procès-verbal</b> de cette réunion, affiché à l'intention du personnel.</li>
  <li>Le comité d'entreprise/les délégués disposent de <b>20 jours</b> pour donner leur avis.</li>
  <li>Saisine obligatoire de l'<b>Inspecteur du travail et des lois sociales</b>, qui émet son avis dans les <b>15 jours ouvrables</b> suivant sa saisine.</li>
</ul>

<h4>3. L'ordre des licenciements</h4>
<p>L'<b>article 46</b> impose, en cas de licenciement collectif, d'établir la liste du personnel touché en consultation avec les délégués du personnel, en respectant — à défaut de plan social conventionnel — un ordre de priorité fondé sur : l'ancienneté de service, les valeurs professionnelles/compétences techniques, et les charges de famille.</p>

<h4>4. La modification des clauses substantielles pour motif économique</h4>
<p>L'<b>article 47</b> permet, pour motif économique, de modifier les clauses substantielles du contrat (et non uniquement de licencier). Le salarié dispose de <b>15 jours</b> pour donner son avis ; son silence passé ce délai vaut acceptation. S'il refuse, la rupture est imputable à l'employeur, et le salarié bénéficie des droits accordés aux licenciés pour motif économique.</p>

<h4>5. L'indemnité de licenciement économique</h4>
<p>L'<b>article 48</b> fixe l'indemnité à <b>10 jours de salaire par année complète de service</b>, sans que le total puisse excéder <b>6 mois de salaire</b> — sauf dispositions plus favorables du contrat individuel ou de la convention collective. Cette indemnité ne se confond ni avec l'indemnité de préavis, ni avec l'indemnité compensatrice de congé payé, ni avec des dommages-intérêts pour licenciement abusif.</p>
<div style="background:var(--surface-2); padding:10px 12px; border-radius:3px; margin:10px 0; border-left:2px solid var(--gold);">
  <p style="font-size:12.5px; color:var(--muted);"><b>Point de vigilance :</b> les articles 44 à 48 proviennent d'un extrait du texte de la Loi n°2024-014 que j'ai pu consulter directement (via un exemplaire mis en ligne par l'Université d'Antananarivo) — ils sont donc bien identifiés, mais je te recommande de recouper avec le Journal Officiel avant l'écrit, cette source n'étant pas le canal officiel de publication.</p>
</div>

<h4>6. Le Réflexe Rédactionnel du Magistrat</h4>
<div style="background:var(--surface-2); padding:12px; border-radius:3px; margin:10px 0;">
  <p><b>❌ À BANNIR :</b> "L'entreprise a des problèmes d'argent, donc elle peut licencier."</p>
  <p><b>✅ FORMULATION ATTENDUE :</b> "Les difficultés économiques invoquées par l'employeur ne dispensent nullement ce dernier du respect de la procédure de consultation préalable du comité d'entreprise et de saisine de l'Inspecteur du travail, prescrite à peine d'irrégularité du licenciement par l'article 45 de la Loi n°2024-014."</p>
</div>

<h4>Application : Le Piège du Jour</h4>
<div style="background:var(--surface-2); padding:12px; border-radius:3px; margin:10px 0;">
  <p><b>Cas :</b> Une entreprise, invoquant des difficultés économiques réelles, licencie collectivement 12 salariés sans consulter au préalable les délégués du personnel ni saisir l'Inspecteur du travail, mais verse à chacun l'indemnité légale de 10 jours par année de service. Le licenciement est-il régulier ?</p>
  <p><b>Correction :</b> Non. Le piège : croire que le versement de l'indemnité légale suffit à régulariser le licenciement. La réalité du motif économique ne dispense pas l'employeur du respect de la <b>procédure</b> de l'article 45 (consultation, procès-verbal, saisine de l'Inspecteur du travail). Le non-respect de cette procédure rend le licenciement <b>abusif dans sa forme</b>, quand bien même son motif de fond serait réel et sérieux — ouvrant droit à des dommages-intérêts distincts de l'indemnité de licenciement déjà versée.</p>
</div>

  { id: 's-dc-11', matiere: 'droit_civil', course_id: 'c-dc-11', enonce_sujet: 'Madame X souhaite divorcer car son mari ne lui parle plus depuis 2 ans, sans violence ni infidélité connue. Peut-elle obtenir le divorce ?', type_exercice: 'cas_pratique', statut: 'a_faire', niveau_difficulte: 2,
    corrige_type: `
<p><b>1. Les faits pertinents :</b> Madame X souhaite divorcer ; son mari ne lui parle plus depuis 2 ans ; aucune violence ni infidélité n'est établie.</p>
<p><b>2. Le problème de droit :</b> Le silence prolongé d'un époux, sans violence ni infidélité, peut-il fonder une demande en divorce en droit malgache ?</p>
<p><b>3. La règle de droit (majeure) :</b> L'article 6 de la Loi n°2007-022 pose un principe unique : le divorce ne peut être obtenu que si l'un des époux a gravement manqué aux obligations et devoirs réciproques du mariage (fidélité, secours, assistance), et que ce manquement a rendu intolérable le maintien de la vie commune. Le droit malgache n'admet ni le divorce par consentement mutuel, ni la simple mésentente comme cause autonome.</p>
<p><b>4. L'application aux faits (mineure) :</b> Le silence prolongé n'est ni l'adultère ni la condamnation pénale visés à l'article 67 comme causes suffisantes — mais ces deux causes ne sont pas limitatives : elles concrétisent le principe général de l'article 6. Il faut donc se demander si le mutisme total pendant 2 ans caractérise, par lui-même, un manquement grave au devoir d'assistance (voire de secours) rendant intolérable le maintien de la vie commune. C'est une question d'appréciation des faits par le juge du fond — mais l'absence totale de communication conjugale pendant une durée aussi longue est susceptible de caractériser un manquement au devoir d'assistance, distinct de l'infidélité ou de la violence.</p>
<p><b>5. La conclusion :</b> Madame X pourrait obtenir le divorce si elle parvient à démontrer, devant le Tribunal, que ce silence prolongé constitue un manquement grave aux devoirs du mariage rendant intolérable la vie commune — non pas en invoquant l'adultère ou une condamnation pénale (absents ici), mais en s'appuyant directement sur le principe général de l'article 6. Elle devra en outre passer par la tentative de conciliation préalable (art. 79) avant toute procédure judiciaire.</p>
<p style="color:var(--muted); font-size:12.5px; margin-top:8px;"><i>Piège à ne pas manquer :</i> un candidat qui répond "non, pas de faute donc pas de divorce" s'arrête à l'article 67 sans remonter au principe général de l'article 6 — c'est une impasse partielle typique.</p>

    corrige_type: `
<p><b>1. Les faits pertinents :</b> X se porte caution de Y pour un prêt de 20.000.000 Ar ; l'acte de cautionnement, par erreur, mentionne 30.000.000 Ar ; la banque réclame ce montant supérieur à X.</p>
<p><b>2. Le problème de droit :</b> La caution peut-elle être tenue au-delà du montant de la dette principale qu'elle a réellement entendu garantir ?</p>
<p><b>3. La règle de droit (majeure) :</b> L'article 6 de la Loi n°2003-041 pose le caractère <b>accessoire</b> du cautionnement : si le cautionnement excède ce qui est dû par le débiteur, ou s'il est contracté à des conditions plus onéreuses, il n'est pas nul pour autant — il est seulement <b>réductible</b> à la mesure de l'obligation principale.</p>
<p><b>4. L'application aux faits (mineure) :</b> La dette principale, née du prêt consenti à Y, s'élève à 20.000.000 Ar. L'acte de cautionnement, en mentionnant 30.000.000 Ar, excède ce montant — par erreur de rédaction. En application du caractère accessoire du cautionnement, cet engagement n'est pas nul, mais doit être ramené à la mesure exacte de l'obligation principale.</p>
<p><b>5. La conclusion :</b> X peut opposer à la banque la réduction de son engagement à hauteur de 20.000.000 Ar — montant réel de la dette de Y — sans que l'erreur de rédaction de l'acte ne puisse l'obliger au-delà, en application de l'article 6 de la Loi n°2003-041.</p>
<p style="color:var(--muted); font-size:12.5px; margin-top:8px;"><i>Piège à ne pas manquer :</i> un candidat qui conclut à la nullité totale du cautionnement se trompe — le texte prévoit expressément la réduction, pas l'annulation. C'est une nuance que le jury aime vérifier précisément.</p>

  { id: 's-pg-02', matiere: 'droit_penal_general', course_id: 'c-pg-02', enonce_sujet: 'X achète une arme et se poste devant le domicile de Y. Police l\'interpelle avant la sortie. Poursuivable ?', type_exercice: 'cas_pratique', statut: 'a_faire', niveau_difficulte: 3,
    corrige_type: `
<p><b>1. Les faits pertinents :</b> X a acheté une arme et s'est posté devant le domicile de Y — deux actes matériels — mais a été interpellé avant tout passage à l'acte contre Y lui-même.</p>
<p><b>2. Le problème de droit :</b> Ces deux actes constituent-ils un commencement d'exécution punissable au titre de la tentative, ou de simples actes préparatoires non punissables ?</p>
<p><b>3. La règle de droit (majeure) :</b> Selon l'article 2 du Code pénal, la tentative de crime suppose un commencement d'exécution, c'est-à-dire un acte qui tend directement et immédiatement à la consommation de l'infraction — par opposition aux actes préparatoires, trop en amont, qui restent impunis en principe (sauf texte spécial).</p>
<p><b>4. L'application aux faits (mineure) :</b> L'achat d'une arme, pris isolément, est un acte équivoque : il peut servir à de multiples usages licites ou illicites — c'est un acte préparatoire classique. Se poster devant le domicile de la victime, en revanche, resserre le lien avec l'infraction projetée, mais tant qu'aucun acte d'approche, d'agression ou de tentative de pénétration n'a été accompli sur la personne ou dans le domicile de Y, l'acte reste encore équivoque quant à l'infraction précise visée (l'intention peut être déduite du contexte, mais l'acte matériel lui-même ne « tend pas directement » à la consommation).</p>
<p><b>5. La conclusion :</b> En l'absence d'un acte matériel non équivoque tendant directement à la commission de l'infraction sur la personne de Y, les faits, tels que décrits, s'analysent en des actes préparatoires — non punissables au titre de la tentative. Une qualification différente (port d'arme illégal, par exemple) resterait envisageable indépendamment de cette analyse.</p>
`

  { id: 's-pg-03', matiere: 'droit_penal_general', course_id: 'c-pg-03', enonce_sujet: 'X repousse un cambrioleur armé, qui chute et décède. X est-il responsable ?', type_exercice: 'cas_pratique', statut: 'a_faire', niveau_difficulte: 2,
    corrige_type: `
<p><b>1. Les faits pertinents :</b> X repousse un cambrioleur armé qui s'introduit chez lui ; celui-ci chute et décède des suites de sa chute.</p>
<p><b>2. Le problème de droit :</b> X peut-il s'exonérer de toute responsabilité pénale au titre de la légitime défense ?</p>
<p><b>3. La règle de droit (majeure) :</b> Les articles 328 et 329 du Code pénal exigent, pour caractériser la légitime défense, la réunion de conditions cumulatives : une agression injuste et actuelle, et une riposte nécessaire et proportionnée à cette agression.</p>
<p><b>4. L'application aux faits (mineure) :</b> L'agression est injuste (cambriolage) et actuelle (intrusion en cours). Le caractère armé du cambrioleur renforce la nécessité de la riposte — X n'avait vraisemblablement pas d'autre moyen d'écarter le danger. Reste la proportionnalité : "repousser" un individu, sans porter de coup mortel intentionnel, est en principe une riposte mesurée face à une intrusion armée ; le décès résulte ici de la chute, non d'un acte de violence disproportionné voulu par X — ce qui distingue nettement le cas d'une riposte excessive (par exemple un coup de feu tiré sur un cambrioleur en fuite, qui sortirait du cadre de la légitime défense).</p>
<p><b>5. La conclusion :</b> Sous réserve de l'appréciation souveraine des juges du fond sur les circonstances precises de la chute, les conditions de la légitime défense apparaissent réunies : X n'est pas responsable pénalement du décès du cambrioleur.</p>
<p style="color:var(--muted); font-size:12.5px; margin-top:8px;"><i>Piège à ne pas manquer en copie :</i> ne jamais conclure "X n'a rien à craindre" sans avoir vérifié CHAQUE condition une par une — un correcteur retire des points condition par condition, pas globalement.</p>
`

  { id: 's-pg-05', matiere: 'droit_penal_general', course_id: 'c-pg-05', enonce_sujet: 'Un fait est commis sous l\'empire d\'une loi prévoyant 5 ans d\'emprisonnement. Avant le jugement, une loi nouvelle réduit la peine à 2 ans. Quelle loi le juge applique-t-il ?', type_exercice: 'cas_pratique', statut: 'a_faire', niveau_difficulte: 2,
    corrige_type: `
<p><b>1. Les faits pertinents :</b> Un fait est commis sous l'empire d'une loi A (5 ans encourus) ; avant le jugement définitif, une loi B, plus douce (2 ans encourus), entre en vigueur.</p>
<p><b>2. Le problème de droit :</b> Quelle loi le juge doit-il appliquer — celle en vigueur au jour des faits, ou celle en vigueur au jour du jugement ?</p>
<p><b>3. La règle de droit (majeure) :</b> Le principe de non-rétroactivité (Constitution, art. 13 al.3) protège contre l'application d'une loi PLUS SÉVÈRE que celle en vigueur au moment des faits. Mais le principe classique de rétroactivité in mitius permet, à l'inverse, l'application immédiate d'une loi pénale plus douce aux faits commis avant son entrée en vigueur, tant qu'aucune condamnation définitive n'est intervenue.</p>
<p><b>4. L'application aux faits (mineure) :</b> La loi B est plus douce (2 ans contre 5). Le jugement n'est pas encore intervenu — aucune condamnation définitive n'existe donc à ce stade.</p>
<p><b>5. La conclusion :</b> Le juge doit appliquer la loi B, plus douce, par le jeu de la rétroactivité in mitius — alors même que les faits ont été commis sous l'empire de la loi A.</p>
<p style="color:var(--muted); font-size:12.5px; margin-top:8px;"><i>Variante à connaître :</i> si le jugement avait déjà été rendu et était devenu définitif avant l'entrée en vigueur de la loi B, celle-ci ne pourrait plus rétroagir sur la condamnation déjà acquise.</p>
`

  { id: 's-pg-06', matiere: 'droit_penal_general', course_id: 'c-pg-02', enonce_sujet: 'X prête sa voiture à Y en sachant que Y compte s\'en servir pour transporter le butin d\'un vol qu\'il projette. Le vol a lieu. X est-il complice ?', type_exercice: 'cas_pratique', statut: 'a_faire', niveau_difficulte: 3,
    corrige_type: `
<p><b>1. Les faits pertinents :</b> X prête sa voiture à Y, en sachant qu'elle servira à transporter le butin d'un vol que Y projette de commettre ; le vol a effectivement lieu.</p>
<p><b>2. Le problème de droit :</b> X peut-il être poursuivi comme complice du vol commis par Y ?</p>
<p><b>3. La règle de droit (majeure) :</b> L'article 60 du Code pénal distingue trois formes de complicité : la provocation (dons, promesses, menaces, abus d'autorité), la fourniture de moyens (armes, instruments ou tout autre moyen ayant servi à l'action, en connaissance de cause), et l'aide ou l'assistance dans les faits préparatoires ou consommatifs. L'article 59 pose la condition commune de l'emprunt de criminalité : un fait principal punissable doit exister.</p>
<p><b>4. L'application aux faits (mineure) :</b> Le prêt de la voiture, connaissant sa destination (transporter le butin), caractérise la <b>fourniture de moyens</b> : X a procuré un moyen — la voiture — ayant servi à l'action, en sachant qu'il devait y servir. Ce n'est ni une provocation (X n'a pas incité Y à voler, il a seulement facilité un projet déjà formé) ni une simple aide matérielle générale, mais précisément la forme visée par la fourniture de moyens. Le fait principal (le vol) a bien été commis par Y — la condition de l'emprunt de criminalité est remplie.</p>
<p><b>5. La conclusion :</b> X est complice du vol commis par Y au titre de la fourniture de moyens (art. 60), et encourt, selon l'article 59, la même peine que l'auteur principal.</p>
<p style="color:var(--muted); font-size:12.5px; margin-top:8px;"><i>Piège à ne pas manquer :</i> un candidat qui répond simplement "X est complice" sans préciser LAQUELLE des trois formes de complicité est caractérisée perd des points — le jury veut voir que tu maîtrises la distinction, pas seulement la conclusion.</p>
`

  { id: 's-pg-04', matiere: 'droit_penal_general', course_id: 'c-pg-04', enonce_sujet: 'Primo-délinquant condamné à 3 ans pour vol. Quels aménagements possibles ?', type_exercice: 'cas_pratique', statut: 'a_faire', niveau_difficulte: 2 },
  // Droit Pénal Spécial
  { id: 's-ps-01', matiere: 'droit_penal_special', course_id: 'c-ps-01', enonce_sujet: 'X donne un coup de poing à Y, qui chute et décède. Homicide volontaire ou coups mortels ?', type_exercice: 'cas_pratique', statut: 'a_faire', niveau_difficulte: 2,
    corrige_type: `
<p><b>1. Les faits pertinents :</b> X donne un coup de poing à Y ; Y chute sous l'effet du coup et décède des suites de sa chute.</p>
<p><b>2. Le problème de droit :</b> Ces faits caractérisent-ils un homicide volontaire (meurtre) ou des coups mortels (violences ayant entraîné la mort sans intention de la donner) ?</p>
<p><b>3. La règle de droit (majeure) :</b> Le <b>meurtre</b> (article 295 du Code pénal) suppose la réunion d'un élément matériel (acte de violence ayant entraîné la mort) et d'un élément moral spécifique : l'<b>intention de donner la mort</b> (animus necandi). Les <b>coups mortels</b>, à l'inverse, supposent une intention de porter des coups ou d'exercer des violences, mais <b>sans intention homicide</b> — la mort résultant d'une conséquence non voulue par l'auteur (le numéro d'article exact incriminant les coups mortels reste à confirmer avant l'écrit).</p>
<p><b>4. L'application aux faits (mineure) :</b> Un simple coup de poing, en l'absence d'autre élément (arme, acharnement, zone vitale visée délibérément, propos antérieurs révélant une intention de tuer), ne permet pas de caractériser, par lui-même, une intention homicide. C'est un acte de violence dont les conséquences — la chute puis le décès — dépassent l'intention initiale de l'auteur, qui voulait porter un coup, non donner la mort.</p>
<p><b>5. La conclusion :</b> En l'état des faits décrits, la qualification de <b>coups mortels</b> (violences ayant entraîné la mort sans intention de la donner) doit être retenue plutôt que celle d'homicide volontaire, faute d'élément révélant une intention homicide chez X. Une instruction plus poussée sur le contexte (antécédents entre X et Y, violence de l'échange, propos tenus) pourrait toutefois faire basculer la qualification.</p>
<p style="color:var(--muted); font-size:12.5px; margin-top:8px;"><i>Piège à ne pas manquer :</i> ne jamais déduire l'intention homicide du seul résultat (la mort) — c'est l'état d'esprit de l'auteur AU MOMENT DE L'ACTE qu'il faut caractériser, pas la gravité du résultat obtenu.</p>
`
  },
  { id: 's-ps-02', matiere: 'droit_penal_special', course_id: 'c-ps-02', enonce_sujet: 'X entre par la fenêtre et emporte des bijoux. Vol ou autre qualification ?', type_exercice: 'cas_pratique', statut: 'a_faire', niveau_difficulte: 1,
    corrige_type: `
<p><b>1. Les faits pertinents :</b> X pénètre dans un lieu par une fenêtre (donc sans y être autorisé, par un moyen d'effraction) et emporte des bijoux appartenant à autrui.</p>
<p><b>2. Le problème de droit :</b> Ces faits caractérisent-ils un simple vol, ou un vol aggravé, et sous quelle qualification précise ?</p>
<p><b>3. La règle de droit (majeure) :</b> L'<b>article 379</b> du Code pénal définit le vol comme la soustraction frauduleuse de la chose d'autrui — trois éléments cumulatifs : une chose mobilière, appartenant à autrui, soustraite (déplacée) frauduleusement (avec conscience de son caractère indu). Le vol simple est aggravé lorsqu'il est commis avec <b>effraction</b> — le franchissement forcé ou anormal d'un obstacle destiné à empêcher l'accès (les numéros d'articles précis prévoyant cette circonstance aggravante restent à confirmer avant l'écrit).</p>
<p><b>4. L'application aux faits (mineure) :</b> Les bijoux sont des choses mobilières appartenant à autrui ; leur appréhension par X, qui n'y était pas autorisé, caractérise la soustraction frauduleuse — les trois éléments constitutifs du vol de l'article 379 sont réunis. Le passage par la fenêtre, moyen d'accès non habituel et non autorisé, caractérise en outre une effraction, circonstance aggravante par rapport au vol simple.</p>
<p><b>5. La conclusion :</b> Les faits caractérisent un <b>vol aggravé par effraction</b>, et non un simple vol — la qualification aggravée doit systématiquement être recherchée dès lors qu'un moyen d'accès forcé ou anormal a été utilisé, sous peine de sous-qualifier les faits.</p>
<p style="color:var(--muted); font-size:12.5px; margin-top:8px;"><i>Piège à ne pas manquer :</i> un candidat qui se contente de « c'est un vol » sans relever la circonstance aggravante d'effraction (l'entrée par la fenêtre) sous-qualifie les faits — le jury attend une lecture attentive de CHAQUE détail matériel de l'énoncé.</p>
`
  },
  { id: 's-ps-03', matiere: 'droit_penal_special', course_id: 'c-ps-03', enonce_sujet: 'X confie sa voiture à Y pour réparation, Y la revend. Z se fait remettre des fonds par de faux documents. Qualifiez.', type_exercice: 'cas_pratique', statut: 'a_faire', niveau_difficulte: 2 },
  { id: 's-ps-04', matiere: 'droit_penal_special', course_id: 'c-ps-04', enonce_sujet: 'X, majeur, a des relations avec Y, 15 ans, après l\'avoir séduite. X est-il responsable ?', type_exercice: 'cas_pratique', statut: 'a_faire', niveau_difficulte: 2 },

  { id: 's-soc-01', matiere: 'droit_social', course_id: 'c-soc-01', enonce_sujet: 'Salarié licencié pour consultation des réseaux sociaux à 3 reprises. Faute grave ?', type_exercice: 'cas_pratique', statut: 'a_faire', niveau_difficulte: 1,
    corrige_type: `
<p><b>1. Les faits pertinents :</b> Un salarié est licencié après avoir consulté les réseaux sociaux à 3 reprises pendant son temps de travail.</p>
<p><b>2. Le problème de droit :</b> Ces faits caractérisent-ils une faute grave justifiant un licenciement immédiat sans préavis, ou une simple cause réelle et sérieuse (voire aucune cause valable) ?</p>
<p><b>3. La règle de droit (majeure) :</b> Selon l'article 39 de la Loi n°2024-014, la rupture du contrat de travail doit reposer sur une cause réelle et sérieuse ; la faute grave — seule à écarter le droit au préavis — se définit comme celle qui rend impossible le maintien du salarié dans l'entreprise, y compris pendant la durée du préavis.</p>
<p><b>4. L'application aux faits (mineure) :</b> Consulter les réseaux sociaux à 3 reprises, sans autre précision (durée des consultations, préjudice causé, avertissements préalables, clause du règlement intérieur expressément violée), relève d'un manquement mineur à la discipline plutôt que d'un fait rendant impossible le maintien du salarié dans l'entreprise. En l'absence d'éléments aggravants (récidive après avertissement écrit, divulgation d'informations confidentielles, préjudice caractérisé pour l'employeur), la faute grave ne peut être présumée du seul fait matériel décrit.</p>
<p><b>5. La conclusion :</b> Sous réserve d'éléments complémentaires non fournis par l'énoncé, les faits décrits ne caractérisent pas, en eux-mêmes, une faute grave — tout au plus une faute légère pouvant justifier une sanction disciplinaire proportionnée (avertissement), mais pas nécessairement un licenciement, et certainement pas un licenciement sans préavis.</p>
<p style="color:var(--muted); font-size:12.5px; margin-top:8px;"><i>Piège à ne pas manquer :</i> ne jamais qualifier un fait de « faute grave » seulement parce que l'employeur l'a invoqué comme tel dans sa lettre de licenciement — c'est au juge (et au candidat en copie) de vérifier si le fait rend réellement impossible le maintien du salarié, indépendamment de la qualification donnée par l'employeur.</p>

// DB — COUCHE D'ACCÈS AUX DONNÉES
// ================================================================
const DB = (() => {
  const NS = 'coachMA_';

  function _read(table) {
    const raw = localStorage.getItem(NS + table);
    return raw ? JSON.parse(raw) : [];
  }
  function _write(table, rows) {
    localStorage.setItem(NS + table, JSON.stringify(rows));
  }
  function uid() {
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
  }

  function seedIfEmpty() {
    const existingCourses = _read('courses');
    const existingIds = new Set(existingCourses.map(c => c.id));
    const newCourses = COURSES_SEED.filter(c => !existingIds.has(c.id));
    if (newCourses.length > 0) _write('courses', [...existingCourses, ...newCourses]);

    const existingSubjects = _read('subjects');
    const existingSubjIds = new Set(existingSubjects.map(s => s.id));
    const newSubjects = SUBJECTS_SEED.filter(s => !existingSubjIds.has(s.id));
    if (newSubjects.length > 0) _write('subjects', [...existingSubjects, ...newSubjects]);

    if (_read('submissions').length === 0) _write('submissions', []);
    if (_read('performance_stats').length === 0) _write('performance_stats', []);
    if (_read('reminders').length === 0) {
      _write('reminders', [
        { id: uid(), heure: '07:00', jours: [1,2,3,4,5,6,7], message: 'Debout. La forteresse ne t\'attend pas. Première session de charbonnage.', actif: true },
        { id: uid(), heure: '13:30', jours: [1,2,3,4,5,6], message: 'Pause terminée. Retour au sujet en cours. Zéro impasse.', actif: true },
        { id: uid(), heure: '20:00', jours: [1,2,3,4,5,6,7], message: 'Bilan du jour : combien de sujets saignés aujourd\'hui ? Si zéro, tu sais ce qu\'il te reste à faire.', actif: true }
      ]);
    }
  }

  return {
    seedIfEmpty,
    getCourses() { return _read('courses'); },
    getCourseById(id) { return _read('courses').find(c => c.id === id) || null; },
    getCoursesByMatiere(matiere) { return _read('courses').filter(c => c.matiere === matiere); },
    getSubjects() { return _read('subjects'); },
    getSubjectsByMatiere(matiere) { return _read('subjects').filter(s => s.matiere === matiere); },
    getSubjectById(id) { return _read('subjects').find(s => s.id === id) || null; },
    updateSubjectStatus(id, statut) {
      const rows = _read('subjects');
      const idx = rows.findIndex(s => s.id === id);
      if (idx >= 0) { rows[idx].statut = statut; _write('subjects', rows); }
      return rows[idx];
    },
    addSubmission(sub) {
      const rows = _read('submissions');
      const row = { id: uid(), created_at: new Date().toISOString(), ...sub };
      rows.push(row);
      _write('submissions', rows);
      return row;
    },
    getSubmissionsBySujet(sujetId) {
      return _read('submissions').filter(s => s.sujet_id === sujetId);
    },
    getAllSubmissions() { return _read('submissions'); },
    bumpStats(matiere, scoreRigorisme) {
      const rows = _read('performance_stats');
      let row = rows.find(r => r.matiere === matiere);
      if (!row) {
        row = { id: uid(), matiere, sujets_manges: 0, score_rigorisme_moyen: 0, derniere_session: null };
        rows.push(row);
      }
      const totalPrev = row.score_rigorisme_moyen * row.sujets_manges;
      row.sujets_manges += 1;
      row.score_rigorisme_moyen = Math.round(((totalPrev + scoreRigorisme) / row.sujets_manges) * 10) / 10;
      row.derniere_session = new Date().toISOString();
      _write('performance_stats', rows);
      return row;
    },
    getStats() { return _read('performance_stats'); },
    getReminders() { return _read('reminders'); },
    updateReminder(id, patch) {
      const rows = _read('reminders');
      const idx = rows.findIndex(r => r.id === id);
      if (idx >= 0) { rows[idx] = { ...rows[idx], ...patch }; _write('reminders', rows); }
      return rows[idx];
    },
    addReminder(rem) {
      const rows = _read('reminders');
      const row = { id: uid(), actif: true, ...rem };
      rows.push(row);
      _write('reminders', rows);
      return row;
    },
    deleteReminder(id) {
      _write('reminders', _read('reminders').filter(r => r.id !== id));
    }
  };
})();

const ANTI_BANALISATION = (() => {
  const DICTIONNAIRE = [
    { motif: /\bil a tu[ée]\b/i, correction: 'il a porté volontairement atteinte à la vie d\'autrui', article: 'Homicide volontaire', matieres: ['droit_penal_special'] },
    { motif: /\bil a fait exprès\b/i, correction: 'l\'élément moral est caractérisé par le dol général', article: 'Théorie générale de l\'infraction', matieres: ['droit_penal_general', 'droit_penal_special'] },
    { motif: /\bles gens? (?:se sont|s\'est) mis(?:es)? d\'accord\b/i, correction: 'la rencontre des volontés caractérisant l\'échange des consentements s\'est opérée', article: 'Art. 1113 s. — formation du contrat', matieres: ['droit_civil'] },
    { motif: /\bil a le droit de\b/i, correction: 'il est titulaire du droit de / il peut valablement se prévaloir de', article: 'Qualification des droits subjectifs', matieres: ['all'] },
    { motif: /\ble patron a vir[ée] (?:le|la)\b/i, correction: 'l\'employeur a procédé au licenciement du salarié', article: 'Droit du licenciement', matieres: ['droit_social'] },
    { motif: /\bc\'est de sa faute\b/i, correction: 'la responsabilité lui incombe au titre du manquement caractérisé', article: 'Art. 1240-1241 — responsabilité délictuelle', matieres: ['droit_civil'] },
    { motif: /\bil doit payer\b/i, correction: 'il est débiteur de l\'obligation de réparation', article: 'Régime de la réparation', matieres: ['droit_civil'] },
    { motif: /\bla loi dit que\b/i, correction: 'il résulte des dispositions de l\'article [X] que', article: '—', matieres: ['all'] },
    { motif: /\bon peut pas\b/i, correction: 'il n\'est pas permis de / la loi prohibe', article: '—', matieres: ['all'] },
    { motif: /\bil y a un probl[eè]me\b/i, correction: 'se pose la question de savoir si', article: '—', matieres: ['all'] },
    { motif: /\bcar c\'est comme [çc]a\b/i, correction: 'en application du principe selon lequel', article: '—', matieres: ['all'] },
    { motif: /\bles juges? doivent être indépendants pour être justes\b/i, correction: 'l\'indépendance institutionnelle et fonctionnelle du juge constitue une garantie structurelle', article: 'Art. 6§1 CEDH', matieres: ['culture_generale'] },
    { motif: /\bl\'entreprise (?:a|avait) le droit de virer\b/i, correction: 'l\'employeur dispose du pouvoir disciplinaire', article: 'Code du travail', matieres: ['droit_social'] },
    { motif: /\btout le monde sait que\b/i, correction: 'il est de principe constant que', article: '—', matieres: ['all'] },
    { motif: /\ben gros\b/i, correction: '(à supprimer — aucune valeur en rédaction juridique)', article: '—', matieres: ['all'] },
    { motif: /\bdonc du coup\b/i, correction: 'il en résulte que / il s\'ensuit que', article: '—', matieres: ['all'] },
    { motif: /\bpour faire simple\b/i, correction: '(à supprimer — un magistrat ne simplifie pas, il qualifie)', article: '—', matieres: ['all'] }
  ];

  const MARQUEURS_RIGUEUR = [
    /il (?:en )?résulte que/i, /il ressort de/i, /en application de l'article/i,
    /au sens de l'article/i, /il convient de (?:relever|souligner|distinguer)/i,
    /en l'espèce/i, /attendu que/i, /dès lors que/i, /il s'ensuit que/i,
    /la majeure|la mineure|en conclusion/i, /conformément à/i
  ];

  function analyser(texte, matiere) {
    const trouvailles = [];
    DICTIONNAIRE.forEach(entry => {
      if (entry.matieres.includes('all') || entry.matieres.includes(matiere)) {
        const match = texte.match(entry.motif);
        if (match) {
          trouvailles.push({
            terme: match[0],
            correction: entry.correction,
            article_vise: entry.article
          });
        }
      }
    });

    const nbMots = texte.trim().split(/\s+/).filter(Boolean).length || 1;
    let score = 100 - (trouvailles.length / Math.max(nbMots / 40, 1)) * 18;
    const nbMarqueurs = MARQUEURS_RIGUEUR.filter(rx => rx.test(texte)).length;
    score += Math.min(nbMarqueurs * 4, 20);
    if (nbMots < 40) score -= 25;
    score = Math.max(0, Math.min(100, Math.round(score * 10) / 10));

    return { trouvailles, score };
  }

  function verdictCoach(score) {
    if (score >= 85) return { ton: 'positif', texte: 'Correct. C\'est le niveau qu\'on garde.' };
    if (score >= 65) return { ton: 'neutre', texte: 'Passable. Mais "passable" n\'a jamais fait admettre personne.' };
    if (score >= 40) return { ton: 'severe', texte: 'Insuffisant. Trop de mots journalistiques.' };
    return { ton: 'critique', texte: 'Inacceptable. Ce texte ne passerait pas le premier tri d\'un jury.' };
  }

  return { analyser, verdictCoach };
})();

const REMINDERS = (() => {
  let lastFiredMinute = null;

  function requestPermission() {
    if (!('Notification' in window)) return Promise.resolve('unsupported');
    if (Notification.permission === 'granted') return Promise.resolve('granted');
    return Notification.requestPermission();
  }

  function fire(message) {
    if (Notification.permission !== 'granted') return;
    new Notification('COACH MOHAMED ALI', { body: message, icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">⚖️</text></svg>' });
  }

  function checkTick() {
    const now = new Date();
    const hhmm = now.toTimeString().slice(0, 5);
    const jourISO = now.getDay() === 0 ? 7 : now.getDay();
    const key = hhmm;
    if (key === lastFiredMinute) return;

    const reminders = DB.getReminders().filter(r => r.actif && r.heure === hhmm && r.jours.includes(jourISO));
    if (reminders.length > 0) {
      reminders.forEach(r => fire(r.message));
      lastFiredMinute = key;
    }
  }

  function start() {
    checkTick();
    setInterval(checkTick, 15000);
  }

  return { requestPermission, start, fire };
})();

function getCoachQuote() {
  const jours = joursRestants();
  const lastVisit = localStorage.getItem('coachMA_lastVisit');
  const today = new Date().toISOString().slice(0, 10);
  let cat = jours >= 0 && jours <= 14 ? 'urgent' : 'normal';
  if (lastVisit) {
    const gapDays = Math.round((new Date(today) - new Date(lastVisit)) / 86400000);
    if (gapDays >= 2) cat = 'comeback';
  }
  localStorage.setItem('coachMA_lastVisit', today);
  const pool = COACH_QUOTES[cat];
  return pool[Math.floor(Math.random() * pool.length)];
}

function coachSay(category) {
  const pool = COACH_QUOTES[category] || COACH_QUOTES.normal;
  return pool[Math.floor(Math.random() * pool.length)];
}

function readCourseIds() {
  return JSON.parse(localStorage.getItem('coachMA_readCourses') || '[]');
}
function markCourseRead(id) {
  const set = new Set(readCourseIds());
  set.add(id);
  localStorage.setItem('coachMA_readCourses', JSON.stringify([...set]));
}
function isMatiereUnlocked(matiere) {
  const courses = DB.getCoursesByMatiere(matiere);
  if (courses.length === 0) return false;
  const read = new Set(readCourseIds());
  return courses.some(c => read.has(c.id));
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3600);
}

  STATE.view = view;
  Object.assign(STATE, payload);
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === view));

function buildGlossary() {
  const courses = DB.getCourses();
  const map = new Map(); // terme -> { def, courses:Set }
  courses.forEach(c => {
    (c.notions_cles || []).forEach(term => {
      if (!map.has(term)) map.set(term, { def: GLOSSARY_DEFS[term] || null, courses: [] });
      map.get(term).courses.push(c);
    });
  });
  return [...map.entries()]
    .map(([term, v]) => ({ term, def: v.def, courses: v.courses }))
    .sort((a, b) => a.term.localeCompare(b.term, 'fr'));
}

function renderDictionnaire() {
  const entries = buildGlossary();
  const withDef = entries.filter(e => e.def).length;
  return `
    <div class="view-header">
      <div class="eyebrow">Dictionnaire</div>
      <h2 class="view-title">Dictionnaire juridique</h2>
      <p class="view-sub">${entries.length} notions rassemblées depuis tous les cours (${withDef} avec définition courte). Tape pour filtrer.</p>
      <p style="font-size:12.5px; color:var(--muted); font-style:italic; margin-top:4px;">« Un mot mal défini, c'est un point perdu avant même d'avoir raisonné. » — Coach Mohamed Ali</p>
    </div>
    <input type="text" id="glossary-search" placeholder="Rechercher une notion (ex : prescription, nullité, dol...)"
      style="width:100%; padding:11px 14px; margin-bottom:18px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); color:var(--text); font-size:14px;">

function renderGlossaryList(entries) {
  if (entries.length === 0) return '<div class="empty-state">Aucune notion ne correspond à ta recherche.</div>';
  return `<div class="grid grid-2">${entries.map(e => `
    <div class="card">
      <div style="font-family:var(--font-display); font-weight:700; font-size:15px; margin-bottom:6px;">${e.term}</div>
      <p style="font-size:13px; color:var(--muted); line-height:1.55; margin-bottom:10px;">
        ${e.def ? e.def : "Définition détaillée dans le cours associé — voir ci-dessous."}
      </p>
      <div class="tag-row">
        ${e.courses.slice(0, 4).map(c => `<span class="tag" style="cursor:pointer;" onclick="setView('course',{currentCourseId:'${c.id}', currentMatiere:'${c.matiere}'})">${MATIERES[c.matiere].n} · ${c.titre.length > 34 ? c.titre.slice(0, 34) + '…' : c.titre}</span>`).join('')}
      </div>
    </div>
  `).join('')}</div>`;
}

function attachDictionnaireEvents() {
  const input = document.getElementById('glossary-search');
  if (!input) return;
  const all = buildGlossary();
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    const filtered = q ? all.filter(e =>
      e.term.toLowerCase().includes(q) || (e.def && e.def.toLowerCase().includes(q))
    ) : all;
    document.getElementById('glossary-list').innerHTML = renderGlossaryList(filtered);
  });
}

const WB_STEPS = [
  { key: 'deconstruction', label: 'Déconstruction' },
  { key: 'plan', label: 'Plan' },
  { key: 'redaction', label: 'Rédaction' }
];

function renderWorkbench() {
  const s = DB.getSubjectById(STATE.currentSubjectId);
  if (!s) return '<div class="empty-state">Sujet introuvable.</div>';
  const prevSubs = DB.getSubmissionsBySujet(s.id);
  const lastForStep = (step) => [...prevSubs].reverse().find(x => x.etape === step);
  const activeStep = STATE.wbStep || 'deconstruction';
  const currentDraft = lastForStep(activeStep);

  const stepsHtml = WB_STEPS.map(st => {
    const done = !!lastForStep(st.key);
    return `<div class="wb-step ${st.key === activeStep ? 'active' : ''} ${done ? 'done' : ''}" onclick="setView('workbench',{currentSubjectId:'${s.id}', wbStep:'${st.key}'})">${st.label}${done ? ' ✓' : ''}</div>`;
  }).join('');

  const lastAnalysis = currentDraft && currentDraft.termes_banalises ? currentDraft : null;

  return `
    <div class="view-header">
      <div class="eyebrow">${MATIERES[s.matiere].label} · ${s.type_exercice.toUpperCase()}</div>
      <h2 class="view-title" style="font-size:22px; line-height:1.35;">${s.enonce_sujet}</h2>
    </div>
    <div class="workbench-steps">${stepsHtml}</div>
    <textarea class="workbench-input" id="wb-textarea" placeholder="${placeholderForStep(activeStep)}">${currentDraft ? currentDraft.texte_brut_utilisateur : ''}</textarea>
    <div style="display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;">
      <button class="btn btn-primary" id="btn-analyser">Soumettre au Filtre Anti-Banalisation</button>
      ${activeStep === 'redaction' ? `<button class="btn" id="btn-saigner" ${s.statut === 'saigne' ? 'disabled' : ''}>${s.statut === 'saigne' ? 'Sujet déjà saigné ✓' : 'Marquer le sujet SAIGNÉ'}</button>` : ''}
      ${s.corrige_type ? `<button class="btn" id="btn-toggle-corrige">${STATE.showCorrige ? '🙈 Cacher le corrigé type' : '📖 Voir un corrigé type'}</button>` : ''}
      <button class="btn" onclick="setView('triage', {currentMatiere:'${s.matiere}'})">← Retour au Sas de Triage</button>
    </div>
    ${s.corrige_type && STATE.showCorrige ? `
    <div class="card" style="margin-top:18px; border-color:var(--gold);">
      <div style="font-family:var(--font-mono); font-size:10.5px; color:var(--gold-bright); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:10px;">📖 Corrigé type — méthode du syllogisme juridique</div>
      ${s.corrige_type}
      <p style="font-size:12px; color:var(--muted); margin-top:12px; font-style:italic;">« Un corrigé type se lit après avoir cherché, pas à sa place. Le coach ne donne pas la réponse à qui n'a pas transpiré. » — Coach Mohamed Ali</p>
    </div>` : ''}
    <div id="analysis-output">${lastAnalysis ? buildCorrectionHtml(lastAnalysis) : ''}</div>
  `;
}

function placeholderForStep(step) {
  if (step === 'deconstruction') return 'Déconstruis le sujet : mots-clés, notion piège, problématique posée. Sois exhaustif.';
  if (step === 'plan') return 'Rédige ton plan détaillé (I / A / B — II / A / B). Chaque titre doit être une phrase juridique.';
  return 'Rédige ta copie complète. C\'est ici que le Filtre Anti-Banalisation sera le plus impitoyable.';
}

function buildCorrectionHtml(sub) {
  const verdict = ANTI_BANALISATION.verdictCoach(sub.score_rigorisme);
  const items = (sub.termes_banalises || []).map(t => `
    <div class="correction-item">
      <span class="banal">${t.terme}</span> → <span class="juste">${t.correction}</span>
      <span class="article-vise">Réf. : ${t.article_vise}</span>
    </div>
  `).join('') || '<div class="correction-item">Aucune banalisation lexicale détectée.</div>';

  return `
    <div class="correction-block">
      <div class="correction-title">Correction chirurgicale</div>
      ${items}
      <div class="score-ring">
        <div class="score-number" style="color:${sub.score_rigorisme >= 65 ? 'var(--green)' : 'var(--red-bright)'}">${sub.score_rigorisme}</div>
        <div>
          <div class="score-label">SCORE DE RIGORISME / 100</div>
          <div style="font-size:13px; margin-top:4px; color:var(--gold-bright); max-width:420px;">${verdict.texte}</div>
        </div>
      </div>
    </div>
  `;
}

function attachWorkbenchEvents() {
  const btnAnalyser = document.getElementById('btn-analyser');
  const btnSaigner = document.getElementById('btn-saigner');
  const btnToggleCorrige = document.getElementById('btn-toggle-corrige');
  const s = DB.getSubjectById(STATE.currentSubjectId);

  if (btnToggleCorrige) {
    btnToggleCorrige.addEventListener('click', () => {
      STATE.showCorrige = !STATE.showCorrige;
      render();
    });
  }

  if (btnAnalyser) {
    btnAnalyser.addEventListener('click', () => {
      const texte = document.getElementById('wb-textarea').value.trim();
      if (texte.length < 15) { toast('Texte trop court.'); return; }
      const { trouvailles, score } = ANTI_BANALISATION.analyser(texte, s.matiere);
      const submission = DB.addSubmission({
        sujet_id: s.id,
        etape: STATE.wbStep,
        texte_brut_utilisateur: texte,
        termes_banalises: trouvailles,
        score_rigorisme: score
      });
      DB.updateSubjectStatus(s.id, s.statut === 'a_faire' ? 'en_cours' : s.statut);
      document.getElementById('analysis-output').innerHTML = buildCorrectionHtml(submission);
      toast(score >= 65 ? 'Reçu. Niveau acceptable.' : 'Reçu. Corrige immédiatement chaque terme signalé.');
    });
  }

  if (btnSaigner) {
    btnSaigner.addEventListener('click', () => {
      const subs = DB.getSubmissionsBySujet(s.id);
      const hasAll = WB_STEPS.every(st => subs.some(x => x.etape === st.key));
      if (!hasAll) { toast('Les 3 étapes doivent être soumises avant de saigner.'); return; }
      const lastRedaction = [...subs].reverse().find(x => x.etape === 'redaction');
      DB.updateSubjectStatus(s.id, 'saigne');
      DB.bumpStats(s.matiere, lastRedaction.score_rigorisme);
      toast('SUJET SAIGNÉ. ' + coachSay('celebration'));
      setView('triage', { currentMatiere: s.matiere });
    });
  }
}

function renderPlanning() {
  const jours = joursRestants();
  const stats = DB.getStats();

  const priorite = Object.keys(MATIERES).map(m => {
    const s = stats.find(x => x.matiere === m);
    return { matiere: m, score: s ? s.score_rigorisme_moyen : -1, nb: s ? s.sujets_manges : 0 };
  }).sort((a, b) => a.score - b.score || a.nb - b.nb);

  const cycleRows = priorite.map((p, i) => `
    <div class="reminder-row">
      <div>
        <div style="font-family:var(--font-display); font-size:15px;">${i+1}. ${MATIERES[p.matiere].label}</div>
        <div class="reminder-msg">${p.nb === 0 ? 'Jamais saigné — priorité absolue' : `${p.nb} sujet(s) saigné(s), score moyen ${p.score}`}</div>
      </div>
      <button class="btn" onclick="setView('triage', {currentMatiere:'${p.matiere}'})">Y aller →</button>
    </div>
  `).join('');

  const examRows = EPREUVES_ECRIT.map(e => {
    const d = new Date(e.date + 'T08:00:00');
    const dj = Math.ceil((d - new Date()) / (1000*60*60*24));
    const passe = dj < 0;
    return `
    <div class="reminder-row">
      <div>
        <div class="reminder-time" style="font-size:14px; color:${passe ? 'var(--muted)' : 'var(--gold-bright)'};">${d.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'})}</div>
        <div class="reminder-msg">${e.label} — coefficient ${e.coeff}</div>
      </div>
      <span class="status-pill ${passe ? 'status-a_faire' : 'status-en_cours'}">${passe ? 'passé' : (dj === 0 ? "aujourd'hui" : dj + ' j.')}</span>
    </div>
  `;}).join('');

  return `
    <div class="view-header">
      <div class="eyebrow">Discipline de fer — Calendrier officiel</div>
      <h2 class="view-title">Plan de bataille</h2>
      <p class="view-sub">${jours >= 0 ? `${jours} jours avant la première épreuve.` : "La semaine d'écrit est engagée."}</p>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <h3 style="font-family:var(--font-display); font-size:16px; margin-bottom:6px;">Semaine de l'écrit — 1er au 4 septembre 2026</h3>
      ${examRows}
    </div>

    <div class="card">
      <h3 style="font-family:var(--font-display); font-size:16px; margin-bottom:6px;">Ordre de priorité recommandé</h3>
      <p style="color:var(--muted); font-size:12.5px; margin-bottom:10px;">Classé par faiblesse mesurée.</p>
      ${cycleRows}
    </div>

    <div class="coach-quote">« Un plan non suivi ne vaut rien. Choisis un sujet ci-dessus et va le saigner maintenant. »</div>
  `;
}

function renderStats() {
  const stats = DB.getStats();
  if (stats.length === 0) return `
    <div class="view-header">
      <div class="eyebrow">Suivi de progression</div>
      <h2 class="view-title">Statistiques</h2>
    </div>
    <div class="empty-state">Aucune donnée. Saigne ton premier sujet.</div>
  `;
  const rows = stats.map(s => `
    <div class="card" style="margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
      <div>
        <div style="font-family:var(--font-display); font-size:15px;">${MATIERES[s.matiere].label}</div>
        <div style="font-family:var(--font-mono); font-size:10.5px; color:var(--muted); margin-top:3px;">Dernière session : ${s.derniere_session ? new Date(s.derniere_session).toLocaleDateString('fr-FR') : '—'}</div>
      </div>
      <div style="display:flex; gap:26px; text-align:right;">
        <div><div class="stat-num" style="font-size:22px;">${s.sujets_manges}</div><div class="stat-lbl">saignés</div></div>
        <div><div class="stat-num" style="font-size:22px; color:${s.score_rigorisme_moyen>=65?'var(--green)':'var(--red-bright)'}">${s.score_rigorisme_moyen}</div><div class="stat-lbl">rigorisme</div></div>
      </div>
    </div>
  `).join('');
  return `
    <div class="view-header">
      <div class="eyebrow">Suivi de progression</div>
      <h2 class="view-title">Statistiques</h2>

function renderMethodologie() {

      <div class="eyebrow">Méthodologie</div>
      <h2 class="view-title">Le prof dans ta poche</h2>

      <p style="font-size:12.5px; color:var(--muted); font-style:italic; margin-top:4px;">« La technique ne remplace pas le savoir. Mais sans elle, ton savoir ne rapportera pas un seul point. » — Coach Mohamed Ali</p>
    </div>
    <div class="tag-row" style="margin-bottom:20px;">
      ${METHODO_TABS.map(t => `<span class="tag methodo-tab ${t.id === tab ? 'active-tab' : ''}" data-tab="${t.id}" style="cursor:pointer; ${t.id === tab ? 'border-color:var(--gold); color:var(--gold-bright); background:var(--surface-2);' : ''}">${t.label}</span>`).join('')}
    </div>
