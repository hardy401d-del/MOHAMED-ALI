<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coach Mohamed Ali — Machine de Métamorphose</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0C0E0D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach M.A.">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  --bg: #0C0E0D;
  --surface: #171A18;
  --surface-2: #1D211E;
  --border: #2A2F2C;
  --text: #E8E6DE;
  --muted: #8A9088;
  --gold: #B8963E;
  --gold-bright: #D4B15C;
  --red: #8B2E28;
  --red-bright: #B23A32;
  --green: #4C8558;
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Inter', -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --radius: 3px;
}

/* -------------------- THEME CLAIR -------------------- */
:root[data-theme="light"] {
  --bg: #F4F2E9;
  --surface: #FFFFFF;
  --surface-2: #ECE9DD;
  --border: #DAD5C4;
  --text: #201F1A;
  --muted: #6B6A5E;
  --gold: #9C7A2E;
  --gold-bright: #7E611F;
  --red: #8B2E28;
  --red-bright: #A6342C;
  --green: #3E7248;
}
:root[data-theme="light"] body {
  background-image:
    radial-gradient(circle at 15% 8%, rgba(184,150,62,0.07), transparent 40%),
    radial-gradient(circle at 85% 92%, rgba(139,46,40,0.05), transparent 45%);
}
:root[data-theme="light"] .toast { box-shadow: 0 8px 24px rgba(0,0,0,0.12); }

* { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100vh;
  min-height: 100dvh;
  background-image:
    radial-gradient(circle at 15% 8%, rgba(184,150,62,0.05), transparent 40%),
    radial-gradient(circle at 85% 92%, rgba(139,46,40,0.05), transparent 45%);
  transition: background-color .2s ease, color .2s ease;
}

body, .sidebar, .card, .topbar, .nav-item, .btn, .tag {
  transition: background-color .2s ease, border-color .2s ease, color .2s ease;
}

::selection { background: var(--gold); color: var(--bg); }

button, input, textarea, select { font-family: inherit; color: inherit; }

a { color: var(--gold-bright); }

/* -------------------- LAYOUT SHELL --------------------
   Par défaut (tablette, PC, "smart PC", grand écran) : barre TOP fixe.
   En dessous de 640px (téléphone) : barre BASSE façon app mobile
   (voir le bloc @media (max-width: 640px) plus bas). */
.app-shell {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
}

.sidebar {
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid var(--border);
  padding: 12px 22px;
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 26px;
  background: linear-gradient(180deg, var(--surface), var(--bg));
  flex-wrap: wrap;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-seal {
  width: 38px; height: 38px;
  border: 1.5px solid var(--gold);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--gold);
  flex-shrink: 0;
}

.brand-text h1 {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.3px;
  line-height: 1.15;
}
.brand-text span {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

nav.main-nav { display: flex; flex-direction: row; flex-wrap: wrap; gap: 2px; flex: 1; }

.nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 12px;
  border-radius: var(--radius);
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  transition: background .12s, color .12s, border-color .12s;
}
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active {
  color: var(--text);
  background: var(--surface-2);
  border-bottom-color: var(--gold);
}
.nav-item .n-icon { font-family: var(--font-mono); font-size: 11px; color: var(--gold); width: 16px; }

.sidebar-footer {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 14px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--muted);
  line-height: 1.6;
}

.icon-btn {
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--surface-2);
  color: var(--text);
  cursor: pointer;
  font-size: 15px;
  flex-shrink: 0;
}
.icon-btn:hover { border-color: var(--gold); color: var(--gold-bright); }

.streak-badge {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  padding: 7px 12px;
  border-radius: var(--radius);
  font-family: var(--font-mono);
  font-size: 11px;
  white-space: nowrap;
}
.streak-badge b { color: var(--gold-bright); font-size: 15px; }

/* -------------------- MAIN -------------------- */
.main {
  padding: 36px 44px;
  overflow-y: auto;
  max-width: 1040px;
  width: 100%;
  margin: 0 auto;
}

.view { display: none; animation: fade .25s ease; }
.view.active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: translateY(0);} }

.view-header { margin-bottom: 28px; border-bottom: 1px solid var(--border); padding-bottom: 18px; }
.eyebrow {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 2px;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.view-title {
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -0.3px;
}
.view-sub { color: var(--muted); font-size: 13.5px; margin-top: 6px; max-width: 620px; line-height: 1.5; }

/* -------------------- CARDS / GRID -------------------- */
.grid { display: grid; gap: 14px; }
.grid-2 { grid-template-columns: 1fr 1fr; }
.grid-3 { grid-template-columns: repeat(3, 1fr); }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
}

.matiere-card {
  cursor: pointer;
  transition: border-color .15s, transform .15s;
}
.matiere-card:hover { border-color: var(--gold); transform: translateY(-1px); }
.matiere-card h3 {
  font-family: var(--font-display);
  font-size: 16.5px;
  margin-bottom: 6px;
}
.matiere-card p { color: var(--muted); font-size: 12px; }
.matiere-count {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--gold);
  margin-top: 10px;
  display: block;
}

/* -------------------- BUTTONS -------------------- */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 18px;
  border-radius: var(--radius);
  border: 1px solid var(--gold);
  background: transparent;
  color: var(--gold-bright);
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.4px;
  cursor: pointer;
  transition: background .15s, color .15s;
  text-transform: uppercase;
}
.btn:hover { background: var(--gold); color: var(--bg); }
.btn.btn-primary { background: var(--gold); color: var(--bg); }
.btn.btn-primary:hover { background: var(--gold-bright); }
.btn.btn-danger { border-color: var(--red-bright); color: var(--red-bright); }
.btn.btn-danger:hover { background: var(--red-bright); color: var(--text); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn:disabled:hover { background: transparent; color: var(--gold-bright); }

/* -------------------- COURSE READER -------------------- */
.course-body {
  font-size: 14.5px;
  line-height: 1.75;
  color: #D8D6CC;
}
.course-body h4 {
  font-family: var(--font-display);
  color: var(--gold-bright);
  font-size: 16px;
  margin: 20px 0 8px;
}
.course-body p { margin-bottom: 10px; }
.course-body ul { margin: 8px 0 12px 20px; }
.course-body li { margin-bottom: 5px; }

.tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.tag {
  font-family: var(--font-mono);
  font-size: 10.5px;
  border: 1px solid var(--border);
  padding: 3px 9px;
  border-radius: 20px;
  color: var(--muted);
}
.tag.jp { border-color: var(--red-bright); color: var(--red-bright); }

/* -------------------- SUBJECTS / TRIAGE -------------------- */
.subject-item {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 10px;
  background: var(--surface);
  position: relative;
  overflow: hidden;
}
.subject-item.locked { opacity: 0.55; }
.subject-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.subject-enonce { font-size: 14px; line-height: 1.5; max-width: 620px; }
.subject-meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); margin-top: 8px; letter-spacing: 0.3px; }

.status-pill {
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: 1px;
  padding: 4px 9px;
  border-radius: 20px;
  white-space: nowrap;
  text-transform: uppercase;
  flex-shrink: 0;
}
.status-a_faire { border: 1px solid var(--muted); color: var(--muted); }
.status-en_cours { border: 1px solid var(--gold); color: var(--gold-bright); }
.status-saigne { border: 1px solid var(--green); color: var(--green); background: rgba(76,133,88,0.1); }

.seal-stamp {
  position: absolute;
  top: 10px; right: 14px;
  width: 64px; height: 64px;
  border: 2px solid var(--green);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transform: rotate(-14deg);
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  color: var(--green);
  letter-spacing: 0.5px;
  text-align: center;
  opacity: 0.85;
  pointer-events: none;
}

/* -------------------- WORKBENCH (Saignage) -------------------- */
.workbench-steps { display: flex; gap: 6px; margin-bottom: 18px; }
.wb-step {
  flex: 1; text-align: center;
  padding: 9px 4px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.5px;
  border: 1px solid var(--border);
  color: var(--muted);
  cursor: pointer;
  text-transform: uppercase;
}
.wb-step.active { border-color: var(--gold); color: var(--gold-bright); background: rgba(184,150,62,0.08); }
.wb-step.done { border-color: var(--green); color: var(--green); }

textarea.workbench-input {
  width: 100%;
  min-height: 220px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 16px;
  font-size: 14px;
  line-height: 1.6;
  border-radius: var(--radius);
  resize: vertical;
}
textarea.workbench-input:focus { outline: none; border-color: var(--gold); }

/* -------------------- ANALYSE / CORRECTION -------------------- */
.correction-block {
  background: var(--surface-2);
  border-left: 3px solid var(--gold);
  padding: 16px 18px;
  border-radius: var(--radius);
  margin-top: 16px;
}
.correction-title {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 1px;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 10px;
}
.correction-item {
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13.5px;
  line-height: 1.55;
}
.correction-item:last-child { border-bottom: none; }
.correction-item .banal { color: var(--red-bright); text-decoration: line-through; font-style: italic; }
.correction-item .juste { color: var(--gold-bright); font-weight: 600; }
.correction-item .article-vise { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); display: block; margin-top: 4px; }

.score-ring {
  display: flex; align-items: center; gap: 14px;
  margin-top: 16px;
}
.score-number { font-family: var(--font-display); font-size: 40px; font-weight: 700; }
.score-label { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); letter-spacing: 1px; }

/* -------------------- STATS -------------------- */
.stat-card { text-align: left; }
.stat-num { font-family: var(--font-display); font-size: 34px; font-weight: 700; color: var(--gold-bright); }
.stat-lbl { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); letter-spacing: 0.5px; margin-top: 4px; text-transform: uppercase; }

/* -------------------- REMINDERS -------------------- */
.reminder-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
}
.reminder-row:last-child { border-bottom: none; }
.reminder-time { font-family: var(--font-mono); font-size: 18px; color: var(--gold-bright); font-weight: 600; }
.reminder-msg { font-size: 13px; color: var(--muted); margin-top: 3px; max-width: 380px; }

input[type="time"], input[type="text"], input[type="checkbox"] {
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 10px;
  border-radius: var(--radius);
  font-size: 13px;
}

.toggle {
  width: 38px; height: 20px;
  background: var(--border);
  border-radius: 20px;
  position: relative;
  cursor: pointer;
  transition: background .15s;
}
.toggle.on { background: var(--green); }
.toggle::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 16px; height: 16px; border-radius: 50%; background: var(--text);
  transition: left .15s;
}
.toggle.on::after { left: 20px; }

/* -------------------- MISC -------------------- */
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--muted);
  font-family: var(--font-mono); font-size: 12px;
}

.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--surface); border: 1px solid var(--gold);
  padding: 14px 20px; border-radius: var(--radius);
  font-size: 13px; max-width: 320px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  animation: slideIn .2s ease; z-index: 999;
}
@keyframes slideIn { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.coach-quote {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 15px;
  color: var(--gold-bright);
  border-left: 2px solid var(--gold);
  padding-left: 14px;
  margin: 18px 0;
  line-height: 1.5;
}

/* -------------------- TABLETTE (641px – 1024px) --------------------
   Toujours en barre TOP, mais plus compacte : icônes seules,
   pas de sous-titre de marque, pour laisser de la place au menu. */
@media (min-width: 641px) and (max-width: 1024px) {
  .sidebar { padding: 10px 16px; gap: 14px; }
  .brand-text span { display: none; }
  .nav-item { font-size: 12px; padding: 8px 9px; }
  .main { padding: 26px 22px; }
}

/* -------------------- TÉLÉPHONE (≤ 640px) --------------------
   Seule cette taille passe en barre BASSE façon app mobile, pour
   rester atteignable au pouce. Tablettes et PC restent en barre TOP. */
@media (max-width: 640px) {
  .sidebar {
    position: fixed; bottom: 0; left: 0; right: 0; top: auto;
    flex-direction: row; align-items: center;
    padding: 8px 6px; z-index: 100;
    border-bottom: none; border-top: 1px solid var(--border);
    gap: 0; justify-content: space-around;
  }
  .brand, .brand-text, .streak-badge, .sidebar-footer-text { display: none; }
  nav.main-nav { flex-direction: row; width: 100%; justify-content: space-around; }
  .nav-item { flex-direction: column; gap: 4px; font-size: 9.5px; border-left: none; border-bottom: none; border-top: 2px solid transparent; text-align: center; padding: 6px 4px; }
  .nav-item.active { border-top-color: var(--gold); border-bottom-color: transparent; }
  .main { padding: 22px 18px 90px; max-width: 100%; }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .view-title { font-size: 26px; }

  /* Le bouton thème reste accessible en haut à droite, même sur téléphone. */
  .sidebar-footer {
    position: fixed; top: 10px; right: 10px; z-index: 101;
    margin: 0; padding: 0;
  }
}

</style>
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-seal">MA</div>
      <div class="brand-text">
        <h1>Coach Mohamed Ali</h1>
        <span>Machine de métamorphose</span>
      </div>
    </div>

    <nav class="main-nav">
      <div class="nav-item active" data-view="accueil"><span class="n-icon">◆</span> Forteresse</div>
      <div class="nav-item" data-view="bibliotheque"><span class="n-icon">◆</span> Bibliothèque</div>
      <div class="nav-item" data-view="dictionnaire"><span class="n-icon">◆</span> Dictionnaire</div>
      <div class="nav-item" data-view="methodologie"><span class="n-icon">◆</span> Méthodologie</div>
      <div class="nav-item" data-view="triage"><span class="n-icon">◆</span> Sas de Triage</div>
      <div class="nav-item" data-view="planning"><span class="n-icon">◆</span> Plan de bataille</div>
      <div class="nav-item" data-view="stats"><span class="n-icon">◆</span> Statistiques</div>
      <div class="nav-item" data-view="alarmes"><span class="n-icon">◆</span> Alarmes</div>
    </nav>

    <div class="sidebar-footer">
      <div class="streak-badge" id="streak-badge"><span>SUJETS SAIGNÉS</span><b>0</b></div>
      <button class="icon-btn" id="btn-theme-toggle" title="Basculer thème clair / sombre">☀</button>
      <span class="sidebar-footer-text">ENMG · MAGISTRATURE · ZÉRO IMPASSE</span>
    </div>
  </aside>

  <main class="main" id="main-view"></main>

</div>

<script>
// ================================================================
// THEME — clair / sombre, persisté en local
// ================================================================
const THEME = {
  KEY: 'coachMA_theme',
  get() { return localStorage.getItem(THEME.KEY) || 'dark'; },
  apply(mode) {
    document.documentElement.setAttribute('data-theme', mode);
    const btn = document.getElementById('btn-theme-toggle');
    if (btn) btn.textContent = mode === 'light' ? '☾' : '☀';
  },
  toggle() {
    const next = THEME.get() === 'light' ? 'dark' : 'light';
    localStorage.setItem(THEME.KEY, next);
    THEME.apply(next);
  },
  init() { THEME.apply(THEME.get()); }
};

// ================================================================
// LECTEUR VOCAL — lecture des cours à voix haute (Web Speech API)
// ================================================================
const VOICE = {
  supported: typeof window !== 'undefined' && 'speechSynthesis' in window,
  utter: null,
  state: 'stopped', // 'stopped' | 'playing' | 'paused'

  stripHtml(html) {
    const div = document.createElement('div');
    div.innerHTML = html;
    return (div.textContent || div.innerText || '').replace(/\s+/g, ' ').trim();
  },

  pickFrenchVoice() {
    const voices = speechSynthesis.getVoices();
    return voices.find(v => v.lang && v.lang.toLowerCase().startsWith('fr')) || voices[0] || null;
  },

  speak(text) {
    if (!VOICE.supported) { toast('Lecture vocale non disponible sur ce navigateur.'); return; }
    speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'fr-FR';
    const v = VOICE.pickFrenchVoice();
    if (v) utter.voice = v;
    utter.rate = 0.98;
    utter.onend = () => { VOICE.state = 'stopped'; VOICE.updateButtons(); };
    utter.onerror = () => { VOICE.state = 'stopped'; VOICE.updateButtons(); };
    VOICE.utter = utter;
    speechSynthesis.speak(utter);
    VOICE.state = 'playing';
    VOICE.updateButtons();
  },

  toggle(html) {
    if (!VOICE.supported) { toast('Lecture vocale non disponible sur ce navigateur.'); return; }
    if (VOICE.state === 'stopped') {
      VOICE.speak(VOICE.stripHtml(html));
    } else if (VOICE.state === 'playing') {
      speechSynthesis.pause();
      VOICE.state = 'paused';
      VOICE.updateButtons();
    } else if (VOICE.state === 'paused') {
      speechSynthesis.resume();
      VOICE.state = 'playing';
      VOICE.updateButtons();
    }
  },

  stop() {
    if (VOICE.supported) speechSynthesis.cancel();
    VOICE.state = 'stopped';
    VOICE.updateButtons();
  },

  updateButtons() {
    const btn = document.getElementById('btn-voice-toggle');
    if (!btn) return;
    btn.textContent = VOICE.state === 'playing' ? '⏸ Pause la lecture' : (VOICE.state === 'paused' ? '▶ Reprendre la lecture' : '🔊 Écouter ce cours');
    const stopBtn = document.getElementById('btn-voice-stop');
    if (stopBtn) stopBtn.style.display = VOICE.state === 'stopped' ? 'none' : 'inline-flex';
  }
};

// ================================================================
// MATIERES — DICTIONNAIRE COMPLET
// ================================================================
const MATIERES = {
  culture_generale: {

<h4>1. Le principe constitutionnel</h4>
<p>L'indépendance de la magistrature est la clé de voûte de l'État de droit. À Madagascar, elle est consacrée par la <b>Constitution du 17 novembre 2010</b> (articles 112 à 114). L'article 112 dispose : <i>"Le pouvoir judiciaire est indépendant du pouvoir exécutif et du pouvoir législatif. Il est chargé de veiller au respect des droits et des libertés définis par la Constitution."</i></p>

<h4>2. Les dimensions de l'indépendance</h4>
<ul>
  <li><b>L'indépendance institutionnelle</b> : le pouvoir judiciaire n'est soumis dans ses décisions qu'à la loi. Le gouvernement ne peut donner d'instructions aux juges.</li>
  <li><b>L'indépendance fonctionnelle</b> : chaque magistrat du siège est inamovible et ne reçoit d'instruction d'aucune autorité dans le jugement des affaires.</li>
</ul>

<h4>3. Les garanties statutaires</h4>
<p>La Loi n° 2013-016 du 18 juillet 2013 portant statut des magistrats établit des garanties :</p>
<ul>
  <li><b>L'inamovibilité</b> : les magistrats du siège ne peuvent être déplacés que sur leur demande ou par décision du Conseil Supérieur de la Magistrature (CSM).</li>
  <li><b>Le CSM</b> : organe constitutionnel garant de l'indépendance. Il est présidé par le Président de la République, mais les magistrats y sont majoritaires dans la formation compétente pour leur discipline et leur carrière.</li>
  <li><b>La garantie de rémunération</b> : elle est fixée par la loi.</li>
</ul>

<h4>1. Le fondement légal : la LTGO — Loi n° 66-003 du 2 juillet 1966</h4>
<p>À Madagascar, le droit des obligations est régi par la <b>Loi n°66-003 du 2 juillet 1966 relative à la théorie générale des obligations</b> (LTGO), complétée par les dispositions du Code civil antérieures à 1960 restées en vigueur. L'article 2, alinéa 2, définit l'acte juridique comme la manifestation, expresse ou tacite, d'une ou plusieurs volontés ayant pour but de créer, modifier, transmettre ou éteindre un droit. L'article 63 distingue deux sortes d'actes juridiques générateurs d'obligation : le contrat (accord de plusieurs volontés) et l'engagement unilatéral.</p>

<h4>3. L'offre, l'acceptation et les vices du consentement — ce qui reste à vérifier avant l'écrit</h4>
<p>La mécanique classique de la formation du contrat (offre ferme et précise, acceptation pure et simple, contre-offre, théorie de la réception, et les trois vices du consentement — erreur, dol, violence) est bien enseignée en droit malgache, mais je n'ai pas encore pu confirmer les numéros d'articles précis de la LTGO qui les portent. Mieux vaut connaître le raisonnement et vérifier le numéro exact dans ton polycopié ou la LTGO avant de le citer à l'écrit, plutôt que de mémoriser un chiffre qui pourrait être faux.</p>
<ul>
  <li><b>L'offre</b> doit être ferme, précise (contenir les éléments essentiels du contrat) et extériorisée.</li>
  <li><b>L'acceptation</b> doit être pure et simple ; toute modification vaut contre-offre.</li>
  <li><b>Les vices du consentement</b> : l'erreur (sur une qualité substantielle), le dol (manœuvres frauduleuses ou réticence dolosive) et la violence (contrainte physique ou morale) affectent la validité du consentement.</li>

<h4>1. Le fondement légal : l'article 204 de la LTGO</h4>
<p>La responsabilité civile délictuelle est régie par la <b>LTGO (Loi n°66-003 du 2 juillet 1966)</b>. Son <b>article 204</b> pose le principe : chacun est responsable du dommage causé par sa faute, y compris une faute non intentionnelle (négligence ou imprudence).</p>

<h4>2. La Faute</h4>
<p>Appréciée <i>in abstracto</i> : on compare le comportement de l'auteur à celui d'une personne raisonnable placée dans les mêmes circonstances.</p>
<ul>
  <li>Faute par commission ou omission.</li>
  <li>Manquement à une obligation légale ou réglementaire.</li>
  <li>Abus de droit.</li>
</ul>

<h4>3. Le Dommage Réparable</h4>
<p>Trois caractères, à retenir comme grille de raisonnement (les numéros d'articles précis restent à vérifier) :</p>
<ul>
  <li><b>Certain</b> : un dommage éventuel n'est pas réparable. Exception : la <b>perte de chance</b>.</li>
  <li><b>Direct</b> : il doit découler immédiatement du fait générateur.</li>
  <li><b>Légitime</b> : l'intérêt doit être protégé par la loi.</li>
</ul>

<h4>4. Le Lien de Causalité</h4>
<p>La théorie de la <b>causalité adéquate</b> est communément retenue. Les causes exonératoires (force majeure, fait d'un tiers, faute de la victime) rompent le lien de causalité.</p>

    titre: 'Le mariage — conditions de formation, effets et nullités',
    contenu_cours: `
<h4>1. Le fondement légal : Loi n° 2007-022 du 20 août 2007 relative au mariage et aux régimes matrimoniaux</h4>
<p>Cette loi définit le mariage comme l'acte civil, public et solennel par lequel un homme et une femme, non engagés dans un précédent mariage, établissent une union légale et durable (art. 1).</p>

<h4>2. Les conditions de fond</h4>
<ul>
  <li><b>L'âge matrimonial</b> (art. 3) : fixé à <b>18 ans</b>, sans distinction entre l'homme et la femme. Avant cet âge, et pour des motifs graves, le Président du Tribunal de Première Instance peut autoriser le mariage, à la demande des parents ou du représentant légal.</li>
  <li><b>Le consentement</b> (art. 4) : n'est pas valable s'il a été extorqué par violence, ou donné sous l'emprise d'une erreur substantielle sur la personne.</li>
  <li><b>L'absence de lien de parenté ou d'alliance prohibé</b> et <b>l'absence de mariage antérieur non dissous</b> (empêchements à mariage — dispositions à situer précisément dans le texte, à vérifier article par article avant l'écrit).</li>
</ul>
<div style="background:var(--surface-2); padding:10px 12px; border-radius:3px; margin:10px 0; border-left:2px solid var(--gold);">
  <p style="font-size:12.5px; color:var(--muted);"><b>Point de vigilance :</b> l'ancienne version de ce cours indiquait à tort « 18 ans pour l'homme, 17 ans pour la femme ». La loi de 2007 a unifié l'âge matrimonial à 18 ans pour les deux sexes, précisément pour lutter contre le mariage des mineures. Ne jamais réciter un chiffre sans l'avoir revérifié dans le texte.</p>
</div>

<h4>3. Les nullités</h4>
<p>Le mariage célébré en violation des conditions de fond ou de forme peut être annulé. La distinction nullité absolue / nullité relative suit la logique générale : nullité absolue lorsque l'intérêt général est en cause (ex. bigamie), nullité relative lorsque seul un intérêt privé est protégé (ex. vice du consentement, défaut d'âge) — <i>vérifier les articles précis de sanction dans le texte de la loi avant de les citer à l'écrit.</i></p>

<h4>4. Les effets patrimoniaux</h4>
<p>Les époux peuvent, par contrat de mariage, disposer des effets que leur union aura sur leurs biens (art. 97). À défaut de contrat, le régime applicable est le régime légal (couramment désigné « zara-mira » dans la pratique malgache), une forme de communauté réduite aux acquêts. Le détail des articles sur la composition de la masse commune sera précisé une fois les sources croisées avec le texte officiel.</p>

<h4>5. Le divorce — quelques repères</h4>
<p>Le dispositif de la décision de divorce est transcrit sur les registres de l'état civil (art. 70). Le divorce dissout le mariage à la date à laquelle la décision devient définitive ; entre époux, les effets patrimoniaux remontent au jour de la demande (art. 71). Il n'est opposable aux tiers qu'à compter de la transcription.</p>
`,

<h4>1. Une singularité à connaître absolument : pas de divorce par consentement mutuel</h4>
<p>Contrairement au droit français, la Loi n°2007-022 <b>n'admet ni le divorce par consentement mutuel, ni la répudiation</b>. Le seul divorce possible à Madagascar est le <b>divorce pour faute</b>. L'<b>article 6</b> pose le principe unique : lorsqu'un des époux a gravement manqué aux obligations et devoirs réciproques résultant du mariage, et que ce manquement a rendu intolérable le maintien de la vie commune, l'autre époux peut demander le divorce au Tribunal de Première Instance.</p>

</div>

<h4>2. Les causes suffisantes de divorce</h4>
<p>L'<b>article 67</b> énonce, comme causes suffisantes de divorce, l'adultère du conjoint et la condamnation à une peine afflictive et infamante. Ces deux causes viennent concrétiser le principe général de l'article 6 (manquement grave rendant intolérable la vie commune), sans épuiser la liste des manquements possibles.</p>

<h4>3. La procédure — une conciliation obligatoire en deux temps</h4>
<ul>
  <li><b>Article 79</b> : avant toute procédure judiciaire, les parties peuvent soumettre leur différend au Chef du Fokontany, au Maire, ou à un conseiller désigné par lui, qui tente de les concilier — cette conciliation, matérialisée par un procès-verbal, lie les parties sauf dispositions contraires à l'ordre public.</li>
  <li><b>Article 80</b> : la demande en divorce est portée devant le Tribunal du lieu de résidence de l'un des époux, ou de leur dernier domicile commun.</li>
  <li><b>Articles 87-88</b> : si la tentative de conciliation devant le juge échoue, celui-ci rend une <b>ordonnance de non-conciliation</b>, qui fixe définitivement la compétence de la juridiction et peut, à titre provisoire, autoriser une résidence séparée, confier la garde des enfants, statuer sur une pension alimentaire pour la durée de l'instance.</li>
</ul>

<h4>4. Les effets du divorce</h4>
<ul>
  <li><b>Article 70</b> : le dispositif de la décision est transcrit sur les registres de l'état civil, dans le mois de la décision.</li>

  <li><b>Article 72</b> : l'époux divorcé cesse d'utiliser le nom du conjoint, sauf autorisation du Tribunal si ce nom présente un intérêt professionnel capital.</li>
  <li><b>Article 73</b> : l'époux aux torts duquel le divorce a été prononcé perd de plein droit, dès la transcription, tous les avantages qui lui avaient été consentis par l'autre époux ou par contrat de mariage — nonobstant toute clause contraire.</li>
</ul>

<h4>1. Le fondement légal : la Loi n°68-012 du 4 juillet 1968 relative aux successions, testaments et donations</h4>
<div style="background:var(--surface-2); padding:10px 12px; border-radius:3px; margin:10px 0; border-left:2px solid var(--gold);">
  <p style="font-size:12.5px; color:var(--muted);"><b>Point de vigilance :</b> l'ancienne version citait des « articles 77 à 145 du Code de la famille » — inexact. Le texte applicable aux successions est la <b>Loi n°68-012 du 04/07/1968</b>, un texte distinct de la loi de 2007 sur le mariage. Les numéros d'articles ci-dessous restent à confirmer précisément dans ce texte avant l'écrit.</p>
</div>

<h4>2. L'ordre des héritiers</h4>
<p>Le droit malgache retient un système de <b>neuf classes d'héritiers</b> appelées successivement, la présence d'un héritier dans une classe excluant en principe les classes suivantes (sous réserve de la représentation) : enfants et descendants, père et mère, frères et sœurs (et leurs descendants), puis les collatéraux plus éloignés, et enfin le conjoint survivant et l'État.</p>
<ul>
  <li><b>Les descendants</b> priment sur les autres classes.</li>
  <li><b>Le conjoint survivant</b> n'a, dans le texte d'origine, pas toujours la qualité d'héritier réservataire — un point qui a fait l'objet de débats de réforme récents pour renforcer sa position (à vérifier pour l'état du droit actuel).</li>
</ul>

<h4>3. La réserve héréditaire et la quotité disponible</h4>
<p>Le principe général — une part réservée aux enfants selon leur nombre, le surplus formant la quotité disponible librement transmissible — est un mécanisme classique du droit successoral que l'on retrouve dans ce texte. Les fractions exactes et les numéros d'articles doivent être vérifiés dans le texte de la loi de 1968 avant d'être cités à l'écrit — ne pas réciter de chiffre non confirmé.</p>

<h4>4. Le Réflexe Rédactionnel</h4>
<div style="background:var(--surface-2); padding:12px; border-radius:3px; margin:10px 0;">
  <p><b>❌</b> "Le testament dit que tout revient à untel."</p>
  <p><b>✅</b> "La libéralité consentie par le défunt ne peut produire effet que dans la limite de la quotité disponible, sous réserve des droits des héritiers réservataires."</p>
</div>

<h4>1. Le fondement légal : la LTGO (Loi n°66-003 du 2 juillet 1966)</h4>
<p>La prescription extinctive relève, comme l'ensemble du régime général des obligations, de la LTGO. Son <b>article 379</b> pose le principe : les actions tant personnelles que réelles se prescrivent par <b>trente ans en matière civile</b>, et par <b>cinq ans en matière commerciale</b>, sauf disposition contraire de la loi. La prescription de la créance principale éteint également les créances accessoires.</p>
<div style="background:var(--surface-2); padding:10px 12px; border-radius:3px; margin:10px 0; border-left:2px solid var(--gold);">
  <p style="font-size:12.5px; color:var(--muted);"><b>Point de vigilance :</b> l'ancienne version de ce cours citait une « Loi n°2016-020 » et des articles 146 à 155 — introuvables et très probablement inventés. Le texte de référence est bien la LTGO, art. 379.</p>
</div>

<h4>2. Les délais de prescription — grille générale</h4>
<ul>
  <li><b>Trente ans</b> : délai de droit commun en matière civile (art. 379 LTGO).</li>
  <li><b>Cinq ans</b> : délai de droit commun en matière commerciale (art. 379 LTGO).</li>
  <li>Des délais spéciaux plus courts existent pour certaines actions particulières (garantie des vices cachés, actions en matière de bail, etc.) — à rechercher texte par texte, plutôt qu'à généraliser depuis le droit commun.</li>
  <li>En matière pénale, le délai de prescription de l'action publique varie selon qu'il s'agit d'un crime, d'un délit ou d'une contravention (voir le cours de procédure pénale).</li>
</ul>

<h4>3. Les causes d'interruption et de suspension</h4>
<p>La logique générale, commune à la plupart des systèmes inspirés du droit civil français, distingue :</p>
<ul>
  <li><b>L'interruption</b> (l'assignation en justice, la reconnaissance du droit par le débiteur) : elle efface le délai déjà couru, qui repart intégralement à zéro.</li>
  <li><b>La suspension</b> (par exemple entre époux, ou à l'égard des mineurs et majeurs protégés) : elle arrête temporairement le délai, qui reprend ensuite sans effacer le temps déjà écoulé.</li>
</ul>
<p style="color:var(--muted); font-size:13px;">Les numéros d'articles précis de la LTGO consacrés à l'interruption et à la suspension restent à confirmer dans le texte avant de les citer à l'écrit.</p>

    contenu_cours: `
<h4>1. Le fondement légal : la Loi n°2003-041 du 3 septembre 2004 sur les sûretés</h4>
<p>Ce texte a spécifiquement abrogé et remplacé, en la matière, les dispositions héritées du Code civil français encore applicables à Madagascar. Il distingue les <b>sûretés personnelles</b> (le cautionnement) et les <b>sûretés réelles</b>, elles-mêmes mobilières ou immobilières selon le bien qu'elles grèvent (art. 61).</p>

<h4>2. Le cautionnement — la reine des sûretés personnelles</h4>
<p>Le cautionnement est l'engagement d'une personne (la caution) à exécuter l'obligation du débiteur si celui-ci n'y satisfait pas lui-même. Deux règles cardinales, toutes deux consacrées par la loi de 2003 :</p>
<ul>
  <li><b>Le caractère accessoire</b> : le cautionnement suit le sort de l'obligation principale — s'il excède ce qui est dû par le débiteur ou s'il est contracté à des conditions plus onéreuses, il n'est pas nul mais simplement réductible à la mesure de l'obligation principale (art. 6). Ce caractère accessoire est affirmé à plusieurs reprises dans le texte (notamment art. 5, 6, 21, 36, 38).</li>
  <li><b>Le certificateur de caution</b> (art. 7) : on peut aussi se porter caution d'une personne qui s'est elle-même portée caution.</li>
</ul>

<h4>3. Les sûretés réelles — privilège, hypothèque, nantissement</h4>
<ul>
  <li><b>Article 60</b> : les causes légitimes de préférence entre créanciers sont le privilège et l'hypothèque.</li>
  <li><b>Article 62</b> : le nantissement est le contrat par lequel un bien est affecté à la garantie du paiement d'une dette.</li>
  <li><b>Article 64</b> : le droit de rétention permet au créancier qui détient légitimement un bien de le retenir jusqu'à parfait paiement, indépendamment de toute autre sûreté sur ce bien.</li>
</ul>

<h4>4. Ce que la loi ne couvre pas</h4>
<p>La loi de 2003 ne régit volontairement pas les techniques contractuelles qui peuvent accessoirement faire fonction de sûreté sans en être une au sens strict — la solidarité, l'indivisibilité, la délégation, l'action directe ou la promesse de porte-fort. Celles-ci restent gouvernées par le droit commun des obligations (LTGO).</p>
`,

    id: 'c-dc-08',
    matiere: 'droit_civil',
    titre: 'Les biens — la propriété foncière, une spécificité malgache à maîtriser',
    contenu_cours: `
<h4>1. Une dualité propre au droit malgache : propriété titrée / non titrée</h4>
<p>Le droit foncier malgache distingue deux régimes de propriété privée, ce qui le différencie nettement du droit français classique :</p>
<ul>
  <li><b>La propriété titrée (immatriculée)</b> : le terrain a fait l'objet d'une immatriculation, avec un titre foncier opposable à tous.</li>
  <li><b>La propriété privée non titrée (PPNT)</b> : régime spécifique, codifié par la <b>Loi n°2022-013</b> (qui a réformé le cadre posé par la Loi n°2005-019), qui reconnaît un droit de propriété aux occupants de terrains ni immatriculés ni cadastrés, dès lors qu'ils en font une occupation personnelle ou collective, réelle, publique et continue selon les usages du lieu (art. 2).</li>
</ul>

<h4>2. Le certificat foncier — l'instrument central de la PPNT</h4>
<p>Le certificat foncier officialise cette propriété non titrée sans passer par la lourde procédure d'immatriculation. L'article 17 précise qu'il permet à son détenteur d'exercer tous les actes juridiques portant sur des droits réels et leurs <b>démembrements</b> reconnus par la loi, selon le même régime juridique que la propriété titrée.</p>

<h4>2 bis. Les démembrements de propriété — la trilogie classique</h4>
<p>La pleine propriété se décompose classiquement en trois attributs, dont la dissociation donne naissance aux démembrements :</p>
<ul>
  <li><b>L'usus</b> (le droit d'user du bien) et le <b>fructus</b> (le droit d'en percevoir les fruits) forment ensemble l'<b>usufruit</b> lorsqu'ils sont détachés de la propriété — l'usufruitier utilise le bien et en perçoit les revenus, sans pouvoir le vendre ou le détruire, et doit le conserver en bon père de famille.</li>
  <li><b>L'abusus</b> (le droit de disposer du bien, de le vendre ou de le détruire) reste alors seul entre les mains du <b>nu-propriétaire</b>.</li>
  <li><b>Les servitudes</b> : charge imposée sur un fonds (le fonds servant) au profit d'un autre fonds (le fonds dominant) — par exemple un droit de passage.</li>
</ul>
<p style="color:var(--muted); font-size:13px;">En pratique malgache, ces démembrements s'appliquent aussi bien à la propriété titrée qu'à la PPNT via le certificat foncier (art. 17, vu ci-dessus) — un pont utile entre la théorie générale des biens et la spécificité foncière locale.</p>

<h4>3. La déchéance pour abandon</h4>
<p>L'<b>article 31</b> de la Loi n°2022-013 prévoit qu'un terrain objet d'un certificat foncier, laissé à l'abandon par son propriétaire pendant <b>20 ans</b>, peut être déclaré vacant — la vacance constituant un motif de déchéance du droit de propriété sur ce terrain.</p>

<h4>4. Pourquoi c'est un sujet à fort potentiel d'accroche</h4>
<div style="background:var(--surface-2); padding:10px 12px; border-radius:3px; margin:10px 0; border-left:2px solid var(--gold);">
  <p style="font-size:12.5px; color:var(--muted);">Le foncier est l'un des sujets les plus sensibles et les plus concrets du droit malgache : il touche à la fois le patrimoine ancestral (le fameux <i>tanindrazana</i>), le développement économique, et des tensions politiques récurrentes autour des réformes foncières. Excellent terrain pour une accroche de culture générale sur la tension entre sécurité juridique moderne et rapport traditionnel à la terre.</p>
</div>

<h4>1. Le fondement légal : la Loi n°63-022 du 20 novembre 1963</h4>
<p>Ce texte, toujours au fondement du droit de la filiation à Madagascar, prévoit à son <b>article 2</b> deux modes d'établissement de la filiation paternelle : la <b>présomption légale</b> et la <b>reconnaissance de paternité</b> (une troisième voie, la déclaration en justice de la paternité, existe aussi pour les actions en recherche de paternité).</p>

<h4>2. La présomption de paternité</h4>
<p>L'<b>article 3</b> pose la présomption <i>pater is est</i> : l'enfant conçu ou né pendant le mariage a pour père le mari. Cette présomption ne s'applique pas à l'enfant né plus de 300 jours après la dissolution du mariage, ni à l'enfant né plus de 300 jours après les dernières nouvelles du mari dans le cadre d'une présomption d'absence.</p>
<p>Les <b>articles 4 et 5</b> étendent une présomption similaire aux enfants nés durant une union célébrée selon les coutumes mais non enregistrée à l'état civil — avec des exceptions parallèles (filiation prohibée par la loi, délai de 300 jours après rupture de l'union).</p>

<h4>3. La reconnaissance et ses limites</h4>
<p>La reconnaissance de paternité est un acte volontaire et personnel. L'action en recherche de paternité, elle, est encadrée strictement : elle est irrecevable si elle établit une filiation prohibée par la loi (filiation adultérine par exemple), et le père prétendu peut se défendre en prouvant qu'il était dans l'impossibilité d'être le père de l'enfant durant la période légale de conception.</p>

<h4>4. L'autorité parentale</h4>
<p>La <b>Loi n°2007-023 du 20 août 2007</b> sur les droits et la protection des enfants définit à son <b>article 14</b> l'autorité parentale comme l'ensemble des droits et devoirs attribués aux parents sur leur enfant jusqu'à majorité ou émancipation par le mariage. Selon l'<b>article 16</b>, elle est exercée en commun par les deux parents mariés ; à l'égard des tiers de bonne foi, chacun est réputé agir avec l'accord de l'autre pour un acte usuel.</p>
`,

    contenu_cours: `
<h4>1. La personnalité juridique</h4>
<p>Toute personne physique est titulaire de la personnalité juridique de sa naissance (vivante et viable) à son décès. L'article 18 du Code civil applicable à Madagascar consacre le principe général : toute atteinte illicite à la personnalité donne à la victime le droit d'en demander la cessation, indépendamment de la responsabilité civile qui peut en résulter pour son auteur.</p>

<h4>2. Une singularité malgache à connaître absolument : trois âges, trois régimes</h4>
<div style="background:var(--surface-2); padding:12px; border-radius:3px; margin:10px 0; border-left:2px solid var(--gold);">
  <p style="font-size:12.5px; color:var(--muted);"><b>Le piège classique :</b> contrairement à la plupart des pays qui alignent la majorité civile sur 18 ans, Madagascar distingue <b>trois âges différents</b> — c'est exactement le genre de détail qu'un jury adore tester :</p>
</div>
<ul>
  <li><b>18 ans</b> : majorité <b>pénale</b> (l'individu relève du droit pénal commun) et âge de délivrance de la carte d'identité nationale.</li>
  <li><b>18 ans</b> également : âge matrimonial légal (Loi n°2007-022, déjà vu dans le cours sur le mariage).</li>
  <li><b>21 ans</b> : âge de la majorité <b>civile</b> de droit commun — c'est seulement à cet âge que la pleine capacité d'exercice civile est acquise, sauf émancipation par le mariage (le mineur émancipé par le mariage acquiert la majorité civile par anticipation).</li>
  <li><b>13 ans</b> : âge de la responsabilité pénale des mineurs (loi relative aux mesures et procédures applicables aux enfants en conflit avec la loi).</li>
</ul>
<p>Cette dissociation entre majorité pénale (18 ans) et majorité civile (21 ans) est une véritable spécificité malgache — un candidat qui applique par réflexe "18 ans = majorité" partout se fera piéger sur un cas pratique civil.</p>

<h4>3. La capacité — distinction jouissance / exercice</h4>
<ul>
  <li><b>La capacité de jouissance</b> : l'aptitude à être titulaire de droits — elle appartient en principe à toute personne, dès la naissance.</li>
  <li><b>La capacité d'exercice</b> : l'aptitude à exercer soi-même ces droits, sans l'assistance ou la représentation d'un tiers — c'est elle qui est retardée jusqu'à 21 ans en matière civile à Madagascar (ou acquise par anticipation via l'émancipation par le mariage).</li>
</ul>

<h4>4. Le statut de l'étranger</h4>
<p>L'article 20 pose le principe que l'étranger jouit à Madagascar des mêmes droits que les nationaux, sauf ceux qui lui sont expressément refusés par la loi (droits d'électorat, d'éligibilité, d'exercice de fonctions publiques ou juridictionnelles) — l'exercice d'un droit pouvant en outre être subordonné à la réciprocité entre États. L'article 28 précise que l'état et la capacité des personnes restent soumis à leur loi nationale, y compris pour les Malgaches résidant à l'étranger.</p>

<h4>5. L'état civil — la preuve de l'identité</h4>
<p>La <b>Loi n°2018-027 relative à l'état civil</b> encadre l'établissement et la conservation des actes (naissance, mariage, décès). Elle réprime spécifiquement l'usage d'un acte d'état civil faux (<b>article 139</b> : deux à dix ans d'emprisonnement) et l'altération, la soustraction ou la destruction volontaire d'un registre d'état civil (<b>article 140</b>) — un lien direct utile avec le cours sur le faux et l'usage de faux en droit pénal spécial.</p>
`,

<h4>1. Le Principe de Légalité Criminelle</h4>
<p>Le Code pénal malgache (dont la structure remonte au Code pénal français de 1810, plusieurs fois modifié depuis) pose à son <b>article 4</b> le principe de légalité : nulle contravention, nul délit, nul crime ne peuvent être punis de peines qui n'étaient pas prévues par la loi avant que les faits aient été commis. Ce principe est repris au niveau constitutionnel : nul ne peut être puni qu'en vertu d'une loi promulguée et publiée antérieurement à la commission de l'acte punissable, et nul ne peut être puni deux fois pour le même fait.</p>
<div style="background:var(--surface-2); padding:10px 12px; border-radius:3px; margin:10px 0; border-left:2px solid var(--gold);">

</div>

<h4>2. L'Élément Matériel</h4>
<p>C'est le comportement extériorisé, positif (action) ou négatif (omission). En matière d'omission, la jurisprudence et la doctrine exigent en général un texte spécifique attribuant expressément un caractère punissable à l'inaction — le numéro d'article correspondant reste à confirmer avant citation à l'écrit.</p>

<h4>3. L'Élément Moral (L'Intention)</h4>
<ul>
  <li><b>Le dol général</b> : conscience et volonté de commettre l'acte.</li>
  <li><b>Le dol spécial</b> : intention particulière exigée par le texte incriminateur.</li>
  <li><b>La faute non intentionnelle</b> : imprudence, négligence.</li>
</ul>

<h4>4. Le Réflexe Rédactionnel</h4>
<div style="background:var(--surface-2); padding:12px; border-radius:3px; margin:10px 0;">
  <p><b>❌</b> "Il a fait exprès."</p>
  <p><b>✅</b> "L'élément moral est caractérisé par le dol général, l'auteur ayant agi en pleine conscience de l'illicéité de son comportement."</p>
</div>

<h4>1. La Tentative</h4>
<p>Le Code pénal distingue selon la gravité de l'infraction :</p>
<ul>
  <li><b>Article 2</b> : la tentative de <b>crime</b>, manifestée par un commencement d'exécution, est punie comme le crime lui-même dès lors qu'elle n'a été suspendue, ou n'a manqué son effet, que par des circonstances indépendantes de la volonté de son auteur (donc pas par désistement volontaire).</li>
  <li><b>Article 3</b> : la tentative de <b>délit</b> n'est punissable que dans les cas où un texte spécial le prévoit expressément — contrairement au crime, ce n'est pas le principe.</li>
</ul>
<div style="background:var(--surface-2); padding:10px 12px; border-radius:3px; margin:10px 0; border-left:2px solid var(--gold);">
  <p style="font-size:12.5px; color:var(--muted);"><b>Point de vigilance :</b> l'ancienne version citait des « articles 8 à 11 » pour la tentative — inexact. Ce sont les <b>articles 2 et 3</b> qui portent ce régime.</p>
</div>

<h4>2. La Complicité — trois formes distinctes, à ne jamais confondre</h4>
<p>Le principe de l'<b>emprunt de criminalité</b> gouverne la complicité : le complice n'est punissable que si un fait principal punissable existe. L'<b>article 59</b> pose la règle générale de la peine (les complices sont punis de la même peine que les auteurs). L'<b>article 60</b> détaille les <b>trois formes</b> que peut prendre la complicité — c'est ce détail qui distingue une bonne copie d'une copie moyenne :</p>
<ul>
  <li><b>La complicité par provocation</b> : par dons, promesses, menaces, abus d'autorité ou de pouvoir, machinations ou artifices coupables, avoir provoqué à l'action ou donné des instructions pour la commettre.</li>
  <li><b>La complicité par fourniture de moyens</b> : avoir procuré des armes, des instruments, ou tout autre moyen ayant servi à l'action, en sachant qu'ils devaient y servir.</li>
  <li><b>La complicité par aide ou assistance</b> : avoir, en connaissance de cause, aidé ou assisté l'auteur (ou les auteurs) dans les faits qui ont préparé ou facilité l'action, ou dans ceux qui l'ont consommée.</li>
</ul>
<div style="background:var(--surface-2); padding:10px 12px; border-radius:3px; margin:10px 0; border-left:2px solid var(--gold);">
  <p style="font-size:12.5px; color:var(--muted);"><b>Pourquoi la distinction compte :</b> chaque forme a son propre régime de preuve. La provocation exige un moyen précis (don, promesse, menace...) — une simple approbation morale ne suffit pas. La fourniture de moyens exige la connaissance de leur usage futur. L'aide/assistance est la plus large, mais exige un acte concret, antérieur ou concomitant à l'infraction — jamais postérieur (sinon c'est du recel, une infraction autonome, voir le cours dédié).</p>
</div>
<ul>
  <li><b>Un fait principal punissable</b> : condition de l'emprunt de criminalité, commune aux trois formes.</li>
  <li><b>L'élément moral</b> : dans les trois cas, la connaissance du projet infractionnel que l'on facilite.</li>
</ul>
`,

<h4>1. Les causes objectives d'irresponsabilité (faits justificatifs)</h4>
<p>Le raisonnement classique, valable en droit malgache comme dans la plupart des systèmes de tradition civiliste, distingue plusieurs faits justificatifs qui neutralisent le caractère infractionnel de l'acte :</p>

<h5 style="margin-top:14px; margin-bottom:6px; color:var(--gold-bright); font-family:var(--font-display);">La légitime défense — en détail, car c'est un thème qui est déjà tombé au concours</h5>
<p>Les <b>articles 328 et 329</b> encadrent ce fait justificatif, avec des conditions cumulatives que le jury aime tester une par une en cas pratique :</p>
<ul>
  <li><b>Une agression</b> : un acte matériel dirigé contre une personne ou un bien.</li>
  <li><b>Injuste</b> : l'agression elle-même ne doit pas être légitime (on ne peut pas se prévaloir de la légitime défense contre l'exécution régulière d'un acte de police, par exemple).</li>
  <li><b>Actuelle</b> (ou imminente) : la riposte à une agression déjà terminée n'est plus une défense mais une vengeance — elle sort du champ de la légitime défense.</li>
  <li><b>Une riposte nécessaire</b> : il ne devait pas exister d'autre moyen d'échapper au danger.</li>
  <li><b>Et proportionnée</b> : la riposte ne doit pas excéder ce qu'exige la gravité de l'agression — c'est souvent le point le plus disputé en cas pratique (une arme à feu contre une agression à mains nues pose presque toujours la question de la disproportion).</li>
</ul>
<p>L'article 329 vise en particulier le cas de la défense contre une effraction ou une escalade commise <b>de nuit</b> dans une maison ou un appartement habité — un cas particulier de légitime défense présumée qu'il faut savoir distinguer du régime général.</p>
<div style="background:var(--surface-2); padding:10px 12px; border-radius:3px; margin:10px 0; border-left:2px solid var(--gold);">
  <p style="font-size:12.5px; color:var(--muted);"><b>Point de vigilance :</b> les articles 328/329 sont bien identifiés dans la tradition du Code pénal dont hérite Madagascar (source confirmée pour la version française de 1810), mais je n'ai pas encore de source strictement malgache les confirmant caractère pour caractère — vérifie-les dans ton Code pénal malgache à jour avant l'écrit. Le raisonnement en 5 conditions cumulatives, lui, est solide et transposable quel que soit le numéro exact.</p>
</div>

<h5 style="margin-top:14px; margin-bottom:6px; color:var(--gold-bright); font-family:var(--font-display);">Les autres faits justificatifs</h5>
<ul>
  <li><b>L'état de nécessité</b> : commission d'un acte pour éviter un danger actuel et plus grave pour soi-même ou autrui.</li>
  <li><b>L'ordre de la loi ou le commandement de l'autorité légitime</b>.</li>
</ul>

<h4>2. Les causes subjectives d'irresponsabilité</h4>
<ul>
  <li><b>Le trouble mental</b> abolissant le discernement au moment des faits.</li>
  <li><b>La contrainte irrésistible</b>, physique ou morale.</li>
  <li><b>La minorité pénale</b>, avec un régime atténué propre aux mineurs.</li>
</ul>

<h4>3. Les causes d'atténuation</h4>
<ul>
  <li><b>L'altération (sans abolition) du discernement</b> : atténue la responsabilité sans l'exclure.</li>
  <li><b>Les circonstances atténuantes</b>, laissées à l'appréciation du juge, qui permettent de descendre en dessous du minimum légal de la peine.</li>
</ul>
<div style="background:var(--surface-2); padding:10px 12px; border-radius:3px; margin:10px 0; border-left:2px solid var(--gold);">

</div>

    contenu_cours: `
<h4>1. Le principe : la non-rétroactivité de la loi pénale plus sévère</h4>
<p>L'<b>article 13, alinéa 3, de la Constitution malgache</b> dispose que nul ne peut être puni qu'en vertu d'une loi promulguée et publiée antérieurement à la commission de l'acte punissable — et que nul ne peut être puni deux fois pour le même fait. Le constituant a ainsi érigé la non-rétroactivité de la loi pénale au rang de <b>principe à valeur constitutionnelle</b>, et non de simple règle légale.</p>

<div style="background:var(--surface-2); padding:12px; border-radius:3px; margin:10px 0; border-left:2px solid var(--gold);">
  <p style="font-size:12.5px; color:var(--muted);"><b>Une actualité directement exploitable — décision HCC n°07-HCC/D3 du 23 février 2024 :</b> saisie de la loi n°2024-001 (celle-là même qui a réformé l'article 332 sur le viol, voir le cours dédié), la Haute Cour Constitutionnelle a censuré une disposition de cette loi précisément parce qu'elle prévoyait une application rétroactive d'une loi pénale plus sévère, jugée contraire à l'article 13 alinéa 3 de la Constitution. C'est un exemple récent, réel et vérifié, parfait pour illustrer une copie sur ce thème — bien plus percutant qu'un exemple abstrait.</p>
</div>

<h4>2. L'exception classique : la rétroactivité in mitius</h4>
<p>Le principe inverse — l'application immédiate, y compris rétroactive, d'une loi pénale plus douce — est un principe classique et largement reconnu en droit pénal comparé : une loi qui adoucit une incrimination ou une peine s'applique aux faits commis avant son entrée en vigueur, tant qu'aucune condamnation définitive n'est intervenue. La logique est simple : si le législateur estime aujourd'hui qu'un fait mérite une réponse pénale moins sévère, il n'y a plus de raison de maintenir la sévérité de l'ancienne loi.</p>
<p style="color:var(--muted); font-size:13px;">Le numéro d'article codifiant précisément ce principe dans le Code pénal malgache reste à confirmer avant citation à l'écrit — le raisonnement, lui, est solide et transposable.</p>

<h4>3. Les lois de forme (procédure)</h4>
<p>Par contraste avec les lois de fond (incrimination, peine), les lois de procédure sont, selon la doctrine classique, d'<b>application immédiate</b> aux instances en cours, y compris pour des faits commis avant leur entrée en vigueur — sous réserve, en général, qu'un jugement au fond n'ait pas déjà été rendu en première instance.</p>

<h4>4. L'application de la loi pénale dans l'espace</h4>
<p>Le principe de base est celui de la <b>territorialité</b> : la loi pénale malgache s'applique aux infractions commises sur le territoire malgache, quelle que soit la nationalité de l'auteur. Ce principe connaît des exceptions classiques en droit comparé (personnalité active pour les infractions commises à l'étranger par un national, personnalité passive lorsque la victime est nationale, réalité pour les atteintes aux intérêts fondamentaux de l'État, universalité pour certains crimes internationaux) — leur transposition précise en droit malgache reste à vérifier article par article.</p>
`,

    contenu_cours: `
<h4>1. Le fondement légal : les articles 145 à 151 du Code pénal malgache</h4>
<p>Le Code pénal malgache consacre le faux en écritures dans une section dédiée : les <b>articles 145, 147, 148, 150 et 151</b> couvrent les faux en écritures publiques, privées, de commerce ou de banque.</p>

<h4>2. La définition classique du faux</h4>
<p>Dans la doctrine de tradition civiliste qui structure ce chapitre, le faux se définit comme l'<b>altération frauduleuse de la vérité</b>, de nature à causer un préjudice, accomplie dans un écrit ou tout autre support destiné à servir de preuve d'un droit ou d'un fait ayant des conséquences juridiques. Cette altération peut être :</p>
<ul>
  <li><b>Matérielle</b> : fausse signature, fabrication ou modification physique du document.</li>
  <li><b>Intellectuelle</b> : le support est matériellement authentique, mais son contenu est mensonger (par exemple une fausse déclaration insérée dans un acte authentique).</li>
</ul>

<h4>3. L'usage de faux</h4>
<p>L'usage de faux est une infraction distincte : il consiste à faire état, en toute connaissance de cause, d'un document faux — pour en tirer profit ou pour nuire à autrui (le produire en justice, s'en servir pour obtenir un droit, etc.). Il suppose la connaissance du caractère faux du document, ce qui le distingue de la simple détention innocente.</p>

<h4>4. Le préjudice, condition du faux</h4>
<p>Le faux est une infraction qui suppose un préjudice, actuel ou seulement éventuel — il peut être matériel, moral, ou toucher un intérêt privé comme un intérêt social. C'est une infraction dite formelle : le résultat concret n'a pas besoin de se réaliser pour que l'infraction soit consommée, dès lors que l'altération frauduleuse était de nature à créer ce préjudice.</p>

<h4>1. Le fondement légal : les articles 309 à 318 du Code pénal malgache</h4>
<p>Cette section, distincte de celle sur l'homicide volontaire, regroupe les <b>blessures et coups volontaires n'ayant pas entraîné la mort</b> — l'infraction se gradue selon la gravité du résultat corporel constaté, et non selon l'intention homicide (qui n'existe pas ici, par définition).</p>

<h4>2. La distinction essentielle avec l'homicide et les coups mortels</h4>
<ul>
  <li><b>Coups et blessures volontaires</b> (art. 309 et s.) : l'auteur a voulu porter le coup ou la blessure, mais pas donner la mort — et la victime survit.</li>
  <li><b>Coups mortels sans intention de tuer</b> : même absence d'<i>animus necandi</i>, mais la victime décède des suites des coups portés.</li>
  <li><b>Meurtre / homicide volontaire</b> (art. 295, vérifié dans le cours dédié) : l'auteur a voulu donner la mort.</li>
</ul>
<p>Cette distinction se joue presque toujours sur la preuve de l'intention (animus) plutôt que sur le geste matériel lui-même — d'où l'importance, en cas pratique, de bien qualifier ce que voulait précisément l'auteur au moment des faits, à partir des éléments objectifs du dossier (arme utilisée, zone visée, propos tenus...).</p>

<h4>3. Les circonstances aggravantes classiques</h4>
<p>Comme pour l'homicide, plusieurs circonstances aggravent la qualification et la peine : la préméditation, la qualité de la victime (ascendant, enfant, personne vulnérable), l'usage d'une arme, ou encore la gravité du résultat corporel (mutilation, infirmité permanente, incapacité de travail prolongée).</p>

</div>

<h4>1. Le fondement légal : la Loi n°2024-014 du 14 août 2024 portant Code du travail</h4>
<p>Le <b>Code du travail malgache a changé</b> : la Loi n°2024-014 (395 articles) a abrogé et remplacé la Loi n°2003-044. L'<b>article 35</b> du nouveau Code pose les 4 causes de rupture du CDI (licenciement, démission, accord des parties, force majeure). L'<b>article 39</b> reprend le principe central : la rupture du contrat de travail est <b>abusive</b> lorsqu'elle est effectuée sans motif légitime, sans cause réelle et sérieuse. Sont notamment abusifs les licenciements non conformes aux procédures prévues par le Code, la convention collective ou les règlements intérieurs, ceux dépourvus de raison professionnelle valable ou fondés sur des motifs fallacieux, ou encore ceux motivés par les opinions ou l'appartenance syndicale du salarié. C'est à l'auteur de la rupture de prouver qu'elle est légitime.</p>

<h4>2. La cause réelle et sérieuse</h4>
<p>La cause doit être <b>réelle</b> (objective, vérifiable) et <b>sérieuse</b> (suffisamment grave pour justifier la rupture).</p>

<h4>3. Le préavis</h4>
<p>L'<b>article 37</b> subordonne la résiliation du CDI à l'initiative de l'une des parties à un <b>préavis</b>, sauf faute lourde. Le non-respect du préavis (ou son respect partiel) ouvre droit à une indemnité correspondant à la rémunération que le salarié aurait perçue pendant la période non respectée. Les durées précises du préavis restent fixées par décret (article 38) — à vérifier avant l'écrit.</p>
<div style="background:var(--surface-2); padding:10px 12px; border-radius:3px; margin:10px 0; border-left:2px solid var(--gold);">
  <p style="font-size:12.5px; color:var(--muted);"><b>Point de vigilance :</b> l'ancienne version de ce cours citait les articles 20/21/22 de la Loi n°2003-044, aujourd'hui abrogée. Les bons articles, dans la Loi n°2024-014 en vigueur, sont les <b>articles 35 (causes de rupture), 37-38 (préavis) et 39 (rupture abusive)</b>. La procédure précise de notification écrite des motifs (ex-article 21) existe toujours dans l'esprit du texte mais son numéro exact dans la nouvelle numérotation reste à confirmer avec le texte intégral avant citation à l'écrit.</p>
</div>

<h4>4. La faute grave et la faute lourde</h4>
<p>Le raisonnement classique distingue la <b>faute grave</b> (rend impossible le maintien du salarié dans l'entreprise) de la <b>faute lourde</b> (faute grave commise avec l'intention de nuire à l'employeur, seule à permettre une rupture sans préavis selon l'article 37) — le numéro d'article la définissant précisément reste à confirmer avant l'écrit.</p>

<h4>1. Les critères du contrat de travail</h4>
<ul>

  <li><b>Un lien de subordination juridique</b> : critère déterminant retenu par la jurisprudence pour distinguer le salarié du prestataire indépendant.</li>
</ul>

<h4>2. Le CDI, forme normale de la relation de travail</h4>
<p>Selon l'<b>article 22</b> de la Loi n°2024-014 (nouveau Code du travail, en vigueur depuis le 26/08/2024), le contrat de travail peut être conclu pour une durée indéterminée ou une durée déterminée. Le CDD reste l'exception : l'<b>article 24</b> réserve le CDD aux travaux qui ne relèvent pas de l'activité normale et permanente de l'entreprise (ou à un ouvrage déterminé), sauf renfort ponctuel d'effectif ou travaux urgents de sécurité.</p>

<h4>3. La durée du CDD</h4>
<p>L'<b>article 25</b> fixe des bornes précises : un CDD ne peut être conclu pour une durée <b>supérieure à 2 ans, ni inférieure à 1 mois</b>. Il peut être renouvelé deux fois, sans que la durée totale ne dépasse <b>6 ans</b>. Après deux renouvellements successifs, il se transforme automatiquement en CDI (article 25). La réembauche au même poste après une interruption de moins de 3 mois est assimilée à un renouvellement.</p>

<h4>4. La période d'essai</h4>
<p>Les durées maximales usuellement retenues restent : <b>8 jours</b> pour les ouvriers, <b>1 mois</b> pour les employés, <b>3 mois</b> pour les cadres — mais le numéro d'article exact dans la nouvelle numérotation (2024-014) reste à confirmer avec le texte intégral avant citation à l'écrit.</p>

<p>Madagascar distingue deux planchers salariaux légaux : le <b>SMIG</b> (Salaire Minimum Interprofessionnel Garanti), applicable aux secteurs industriel, commercial et des services, et le <b>SMAG</b> (Salaire Minimum Agricole Garanti), inférieur, applicable au secteur agricole. Ces montants sont fixés et régulièrement révisés par décret gouvernemental.</p>

<h4>1. Une institution née en 1968</h4>
<p>La <b>Caisse Nationale de Prévoyance Sociale (CNaPS)</b>, créée par la <b>Loi n°68-023 du 17 décembre 1968</b>, a succédé à la CNAFAT (Caisse Nationale d'Allocations Familiales et des Accidents du Travail), elle-même créée par l'ordonnance n°62-078 du 29 septembre 1962. Établissement public à caractère industriel et commercial doté de la personnalité morale et de l'autonomie financière, elle est placée sous la tutelle conjointe du ministère chargé du Travail et du ministère chargé des Finances.</p>

<h4>2. Les trois régimes gérés par la CNaPS</h4>
<ul>
  <li><b>Les prestations familiales</b> : versées aux allocataires ayant des enfants à charge.</li>
  <li><b>Les accidents du travail et maladies professionnelles</b> : prise en charge des frais médicaux, indemnités journalières en cas d'arrêt, rente en cas de séquelle. L'accident du travail doit être déclaré dans les <b>48 heures</b>, la maladie professionnelle dans les <b>15 jours</b>.</li>
  <li><b>Les pensions de retraite</b>.</li>
</ul>

<h4>3. Le financement — les cotisations</h4>
<p>Le régime est financé par des cotisations, payables trimestriellement par l'employeur via la Déclaration Nominative de Salaires (DNS). L'<b>article 125</b> du Code de prévoyance sociale habilite la CNaPS à poursuivre auprès du débiteur défaillant le recouvrement des cotisations et le remboursement des prestations versées ou dues.</p>
<div style="background:var(--surface-2); padding:10px 12px; border-radius:3px; margin:10px 0; border-left:2px solid var(--gold);">

</div>

<h4>4. Une réforme en cours</h4>
<p>Une réforme visant à étendre la couverture sociale aux travailleurs non salariés, dans le cadre de la couverture santé universelle (CSU), est en cours de déploiement — un bon point d'actualité à mobiliser si le sujet porte sur l'évolution de la protection sociale malgache.</p>

<h4>1. Le fondement légal : la Loi n°2003-036 du 30 janvier 2004 sur les sociétés commerciales</h4>
<p>Madagascar <b>n'est pas membre de l'OHADA</b> (l'adhésion a été étudiée vers 2011 mais jamais concrétisée). Le droit des sociétés commerciales malgache relève donc d'un texte national propre — la Loi n°2003-036 — même si celle-ci s'est largement inspirée à la fois du droit français et de l'Acte uniforme OHADA sur les sociétés commerciales, sans que Madagascar y soit juridiquement soumis.</p>

</div>

<h4>2. La personnalité morale</h4>
<p>Comme dans la plupart des systèmes de tradition civiliste, la société acquiert la personnalité morale à compter de son immatriculation au registre du commerce et des sociétés (RCCM) — le numéro d'article précis de la loi de 2003 reste à confirmer.</p>

<h4>3. La SARL et la SA</h4>
<p>La loi malgache organise, comme le droit français dont elle s'inspire, plusieurs formes de sociétés commerciales dont la <b>SARL</b> (responsabilité limitée aux apports) et la <b>SA</b> (capital divisé en actions). Les seuils précis de capital minimum et de nombre d'associés/actionnaires doivent être vérifiés dans le texte à jour de la Loi n°2003-036 avant d'être cités à l'écrit — les chiffres de l'ancienne version de ce cours (calqués sur l'OHADA) ne sont pas fiables pour Madagascar.</p>
`,

    jurisprudence_associee: ['À compléter avec des décisions vérifiées de la Cour Suprême de Madagascar'],

  },
  {
    id: 'c-com-03',
    matiere: 'droit_commercial',
    titre: 'Le fonds de commerce — éléments, vente et nantissement',
    contenu_cours: `
<h4>1. Le fondement légal : une loi spéciale malgache</h4>
<p>Madagascar dispose d'un texte dédié : la <b>Loi relative à la vente et au nantissement des fonds de commerce</b>, complétée par le Code de commerce (notamment ses articles 446 à 448, applicables en cas de faillite ou de liquidation judiciaire touchant un fonds nanti) et par la <b>Loi n°99-025 du 19 août 1999</b> sur la publication des sûretés mobilières.</p>

<h4>2. Les éléments du fonds de commerce</h4>
<p>Le fonds de commerce est une universalité mobilière regroupant des éléments incorporels (clientèle, achalandage, nom commercial, enseigne, droit au bail) et corporels (matériel, outillage, marchandises). La clientèle en est l'élément central : sans elle, il n'y a pas de fonds de commerce.</p>

<h4>3. La publicité des sûretés mobilières</h4>
<p>Selon la Loi n°99-025, les sûretés mobilières affectant les actifs d'une entreprise assujettie à immatriculation — dont le <b>nantissement du fonds de commerce</b>, le nantissement d'actions ou parts sociales, le nantissement sur les stocks — sont inscrites au <b>registre du commerce et des sociétés</b> pour être consultables par tout intéressé. Sont également publiées les demandes en résolution judiciaire de la vente d'un fonds de commerce.</p>

<h4>4. Le nantissement du fonds de commerce en pratique</h4>
<ul>
  <li><b>Article 12</b> (loi spéciale) : entre créanciers gagistes, le rang se détermine par la date d'inscription ; les créanciers inscrits le même jour viennent en concurrence.</li>
  <li><b>Article 13</b> : en cas de déplacement du fonds, les créances inscrites deviennent immédiatement exigibles si le propriétaire n'a pas prévenu les créanciers inscrits au moins 15 jours à l'avance de son intention de déplacer le fonds et de son nouveau siège.</li>
  <li>Le <b>privilège prévu à l'article 67 de la Loi n°2003-041</b> (sûretés, déjà vue) sur le fonds de commerce n'a lieu qu'à la condition d'un acte public ou sous seing privé dûment enregistré, précisant la somme due et la nature des choses mises en gage.</li>
</ul>
<div style="background:var(--surface-2); padding:10px 12px; border-radius:3px; margin:10px 0; border-left:2px solid var(--gold);">
  <p style="font-size:12.5px; color:var(--muted);"><b>Point de méthode :</b> le nantissement du fonds de commerce est une sûreté réelle mobilière <b>sans dépossession</b> — le commerçant continue d'exploiter son fonds tout en l'ayant affecté en garantie. C'est une distinction à toujours préciser en cas pratique face à un gage classique (qui suppose la dépossession).</p>
</div>
`,

    contenu_cours: `
<h4>1. Le fondement légal : la LTGO (Loi n°66-003 du 02/07/1966)</h4>
<p>Le cours c-dc-02 de cette bibliothèque traite la responsabilité <b>délictuelle</b>. Un trou classique du squelette : la responsabilité <b>contractuelle</b>, qui naît de l'inexécution — totale ou partielle — d'une obligation née d'un contrat valablement formé. Les <b>articles 168 à 186</b> de la LTGO organisent l'effet des obligations et les sanctions de leur inexécution.</p>

<h4>2. Les trois sanctions classiques de l'inexécution</h4>
<ul>
  <li><b>L'exécution forcée</b> : le créancier peut demander au juge de contraindre le débiteur à exécuter, quand cela reste possible.</li>
  <li><b>La résolution du contrat</b> : dans un contrat synallagmatique, l'inexécution par une partie de son obligation autorise l'autre à demander en justice la résolution — l'anéantissement rétroactif du contrat.</li>
  <li><b>Les dommages-intérêts</b> : réparation du préjudice causé par l'inexécution, cumulable ou non avec les deux sanctions précédentes selon les cas.</li>
</ul>

<h4>3. L'exception d'inexécution</h4>
<p>Mécanisme distinct de la résolution : dans un contrat synallagmatique, une partie peut <b>refuser d'exécuter sa propre obligation</b> tant que son cocontractant n'exécute pas la sienne — sans avoir besoin de saisir le juge au préalable. C'est une arme défensive immédiate, alors que la résolution est une arme offensive qui suppose (en principe) une décision de justice.</p>

<h4>4. La mise en demeure, préalable classique</h4>
<p>En principe, le créancier doit mettre en demeure son débiteur défaillant avant de pouvoir se prévaloir de l'inexécution — sauf clause contraire ou urgence particulière. Le numéro d'article exact organisant la mise en demeure dans la LTGO reste à confirmer avant l'écrit.</p>
<div style="background:var(--surface-2); padding:10px 12px; border-radius:3px; margin:10px 0; border-left:2px solid var(--gold);">
  <p style="font-size:12.5px; color:var(--muted);"><b>Point de vigilance :</b> les articles 168 à 186 de la LTGO couvrent bien « l'effet des obligations » selon les sources consultées, mais je n'ai pas pu vérifier le détail article par article (lequel porte la résolution, lequel porte l'exception d'inexécution). Retiens le raisonnement en trois sanctions et vérifie les numéros précis dans ton polycopié avant de les citer à l'écrit.</p>
</div>

<h4>5. Le Réflexe Rédactionnel du Magistrat</h4>
<div style="background:var(--surface-2); padding:12px; border-radius:3px; margin:10px 0;">
  <p><b>❌ À BANNIR :</b> "Le vendeur n'a pas livré, donc l'acheteur peut ne pas payer."</p>
  <p><b>✅ FORMULATION ATTENDUE :</b> "Le défaut de délivrance imputable au vendeur autorise l'acheteur à opposer l'exception d'inexécution et à suspendre le paiement du prix, sans préjudice de son droit de poursuivre, le cas échéant, la résolution du contrat pour inexécution."</p>
</div>

<h4>Application : Le Piège du Jour</h4>
<div style="background:var(--surface-2); padding:12px; border-radius:3px; margin:10px 0;">
  <p><b>Cas :</b> Rakoto a commandé et payé d'avance une machine agricole à un fournisseur, qui tarde à livrer sans justification depuis 4 mois. Rakoto veut immédiatement récupérer son argent sans passer par le tribunal. Est-ce possible ?</p>
  <p><b>Correction :</b> Non, pas directement. Ayant déjà payé, Rakoto ne peut pas invoquer l'exception d'inexécution (qui suppose de ne pas avoir encore exécuté sa propre obligation). Il doit mettre en demeure le fournisseur, puis, à défaut d'exécution, saisir le juge pour obtenir la <b>résolution judiciaire</b> du contrat et la restitution des sommes versées, éventuellement assortie de dommages-intérêts. Le piège : confondre exception d'inexécution (arme défensive, pas de juge nécessaire) et résolution (arme offensive, en principe judiciaire).</p>
</div>

<h4>1. Le fondement légal : le Code civil malgache (dispositions maintenues)</h4>
<p>Contrairement à la théorie générale des obligations (régie par la LTGO de 1966), les <b>contrats spéciaux</b> — dont la vente — restent régis à Madagascar par les dispositions du <b>Code civil</b> antérieures maintenues en vigueur, largement calquées sur le Code civil français de 1804. L'<b>article 1582</b> définit la vente comme la convention par laquelle l'un s'oblige à livrer une chose, et l'autre à la payer.</p>

<h4>2. La vente de la chose d'autrui : nullité</h4>
<p>L'<b>article 1599</b> pose une règle piège classique : <b>la vente de la chose d'autrui est nulle</b> — elle peut donner lieu à des dommages-intérêts lorsque l'acheteur ignorait que la chose fût à autrui. Cette règle a été rappelée par la <b>Cour de cassation de Madagascar (arrêt n°96 du 4 mars 2022)</b>, qui a confirmé la nullité d'une vente portant sur un bien appartenant à un tiers.</p>
<div style="background:var(--surface-2); padding:10px 12px; border-radius:3px; margin:10px 0; border-left:2px solid var(--gold);">
  <p style="font-size:12.5px; color:var(--muted);"><b>Point de vigilance :</b> l'article 1599 et l'arrêt du 4 mars 2022 sont corroborés par plusieurs sources indépendantes. Les autres numéros d'articles ci-dessous (1641, 1648) correspondent à la codification française classique reprise à Madagascar — vérifie-les dans le texte consolidé avant de les citer avec certitude à l'écrit, la numérotation exacte du Code civil malgache pouvant avoir été localement modifiée sur des points de détail.</p>
</div>

<h4>3. Les obligations du vendeur</h4>
<ul>
  <li><b>La délivrance</b> : remise de la chose vendue à l'acheteur.</li>
  <li><b>La garantie d'éviction</b> : le vendeur garantit l'acheteur contre toute revendication d'un tiers sur la chose vendue.</li>
  <li><b>La garantie des vices cachés</b> (article 1641 et suivants) : le vendeur est tenu de la garantie à raison des défauts cachés de la chose qui la rendent impropre à l'usage auquel on la destine, ou qui diminuent tellement cet usage que l'acheteur ne l'aurait pas acquise, ou n'en aurait donné qu'un moindre prix, s'il les avait connus.</li>
  <li><b>Le bref délai</b> (article 1648) : l'action en garantie des vices cachés doit être intentée dans un « bref délai » suivant la découverte du vice — la durée précise reste à vérifier avant l'écrit.</li>
</ul>

<h4>4. Le Réflexe Rédactionnel du Magistrat</h4>
<div style="background:var(--surface-2); padding:12px; border-radius:3px; margin:10px 0;">
  <p><b>❌ À BANNIR :</b> "Il a vendu un truc qui n'était pas à lui, donc c'est annulé."</p>
  <p><b>✅ FORMULATION ATTENDUE :</b> "La vente portant sur la chose d'autrui encourt la nullité, conformément à l'article 1599 du Code civil, telle que rappelée par la Cour de cassation de Madagascar dans son arrêt n°96 du 4 mars 2022."</p>
</div>

<h4>Application : Le Piège du Jour</h4>
<div style="background:var(--surface-2); padding:12px; border-radius:3px; margin:10px 0;">
  <p><b>Cas :</b> Rasoa vend à Bao une parcelle de terrain qui appartient en réalité à sa sœur, restée à l'étranger. Bao, de bonne foi, l'ignorait totalement. Quelle est la sanction, et Bao a-t-elle un recours ?</p>
  <p><b>Correction :</b> La vente est <b>nulle</b> (article 1599) puisque Rasoa a vendu la chose d'autrui. Le piège : ce n'est pas une simple inexécution donnant lieu à résolution, c'est une <b>nullité</b> — le contrat est réputé n'avoir jamais existé. Bao, de bonne foi et ignorant que le bien appartenait à un tiers, peut en outre réclamer des <b>dommages-intérêts</b> à Rasoa, comme le prévoit expressément l'article 1599.</p>
</div>
