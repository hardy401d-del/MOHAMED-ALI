function methodoCard(title, bodyHtml) {
  return `<div class="card" style="margin-bottom:16px;"><h4 style="font-family:var(--font-display); font-size:16px; margin-bottom:10px;">${title}</h4>${bodyHtml}</div>`;
}

function renderMethodoTab(tab) {
  if (tab === 'shipa') return renderMethodoShipa();
  if (tab === 'dissert') return renderMethodoDissertation();
  if (tab === 'cas') return renderMethodoCasPratique();
  if (tab === 'synthese') return renderMethodoSynthese();
  if (tab === 'accroches') return renderMethodoAccroches();
  if (tab === 'relecture') return renderMethodoRelecture();
  return '';
}

function renderMethodoShipa() {
  return `
    <div class="card" style="border-color:var(--gold); margin-bottom:20px;">
      <p style="font-size:13.5px; line-height:1.6;">
        <b>La méthode SHIPA</b> est le squelette d'introduction à réutiliser pour <b>n'importe quel sujet, dans n'importe quelle matière</b> —
        dissertation de culture générale comme introduction d'un cas pratique ou d'un exposé de droit civil ou pénal.
        5 lettres, 5 étapes, toujours dans le même ordre. Une fois automatisée, elle te fait gagner un temps précieux le jour de l'épreuve :
        tu n'as plus à te demander "par où je commence", juste à remplir chaque case.
      </p>
    </div>
    ${methodoCard('S — Situation du sujet', `
      <p>Tu places le sujet dans son cadre général : de quel domaine du droit (ou de la vie en société, pour la culture générale) relève-t-il ? À quel moment, dans quel contexte apparaît-il ? C'est la porte d'entrée — large, mais déjà orientée vers le sujet.</p>
      <p style="color:var(--muted); font-size:12.5px; margin-top:6px;">Exemple de formule : « Le sujet s'inscrit dans le cadre de [domaine], à un moment où [contexte : réforme récente, débat de société, évolution jurisprudentielle]. »</p>
    `)}
    ${methodoCard('H — Historique du sujet (juridique ou autre)', `
      <p>D'où vient la notion ou la règle en jeu ? Quelle a été son évolution ? En droit, cela peut être l'origine d'un texte (LTGO 1966, Code pénal hérité de 1810 et modifié depuis...) ; en culture générale, cela peut être une évolution sociale, philosophique ou historique du sujet.</p>
      <p style="color:var(--muted); font-size:12.5px; margin-top:6px;">Piège à éviter : un historique-catalogue qui récite des dates sans lien avec le sujet. Chaque étape historique mentionnée doit préparer la problématique.</p>
    `)}
    ${methodoCard('I — Intérêt du sujet', `
      <p>Pourquoi ce sujet mérite-t-il d'être posé aujourd'hui ? C'est ici que tu montres l'enjeu réel : théorique (une notion mal stabilisée, une summa divisio qui vacille), pratique (des conséquences concrètes pour les justiciables), ou d'actualité (une réforme, un débat en cours).</p>
      <p style="color:var(--muted); font-size:12.5px; margin-top:6px;">C'est souvent ici, et pas dans l'accroche, que se loge la vraie valeur ajoutée d'une bonne copie — le jury voit tout de suite si le candidat a compris pourquoi on lui pose ce sujet.</p>
    `)}
    ${methodoCard('P — Problématique', `
      <p>Une question — jamais une reformulation plate du sujet, jamais une question fermée du type "oui ou non". Elle doit contenir la <b>tension</b> que le devoir va résoudre : deux logiques, deux intérêts, deux lectures possibles qui s'affrontent.</p>
      <p style="color:var(--muted); font-size:12.5px; margin-top:6px;">Test rapide : si ta problématique peut se répondre en un mot, elle est trop plate. Elle doit appeler une démonstration.</p>
    `)}
    ${methodoCard('A — Annonce du plan, avec connecteurs logiques', `
      <p>Jamais scolaire (« nous verrons dans une première partie... »). Utilise des connecteurs qui donnent déjà la tension du devoir :</p>
      <ul style="margin-left:20px; line-height:1.9;">
        <li><b>« Si... il n'en demeure pas moins que... »</b> — pour opposer principe et limite.</li>
        <li><b>« D'une part... d'autre part... »</b> — pour une tension plus neutre entre deux logiques.</li>
        <li><b>« Bien que... »</b>, <b>« Dès lors que... »</b>, <b>« Toutefois... »</b> — pour marquer une bascule entre le I et le II.</li>
      </ul>
      <p style="color:var(--muted); font-size:12.5px; margin-top:6px;">L'annonce de plan doit se lire comme une phrase de démonstration à part entière, pas comme un sommaire récité.</p>
    `)}
  `;
}

function renderMethodoDissertation() {
  return `
    ${methodoCard("1. L'introduction — le tiers de la note se joue là", `
      <p style="margin-bottom:8px;">L'introduction se construit dans cet ordre, sans en sauter une étape :</p>
      <ol style="margin-left:20px; line-height:1.9;">
        <li><b>L'accroche</b> — une phrase qui amène le sujet sans le paraphraser (voir l'onglet « Banque d'accroches »).</li>
        <li><b>La contextualisation</b> — replacer le sujet dans son domaine, rappeler ce qu'il présuppose déjà (les notions acquises).</li>
        <li><b>La définition des termes du sujet</b> — chaque mot important est défini, y compris les mots de liaison du sujet lui-même (« et », « ou », « à l'épreuve de »...) qui orientent le sens.</li>
        <li><b>La délimitation</b> — ce que le sujet inclut, ce qu'il exclut explicitement (hors-sujet à éviter).</li>
        <li><b>La problématique</b> — une question, pas une reformulation plate du sujet. Elle doit contenir la tension que le devoir va résoudre.</li>
        <li><b>L'annonce de plan</b> — jamais scolaire (« nous verrons dans une première partie... »), mais énoncée comme une démonstration : « si [I], il n'en demeure pas moins que [II] ».</li>
      </ol>
    `)}
    ${methodoCard("2. Le plan — l'architecture qui porte la démonstration", `
      <p style="margin-bottom:8px;">Le format classique : <b>2 parties, 2 sous-parties chacune</b> (I.A, I.B, II.A, II.B), équilibrées en longueur.</p>
      <ul style="margin-left:20px; line-height:1.8;">
        <li>Chaque partie doit être une <b>idée</b>, pas un thème descriptif. « Le principe » / « Ses limites » vaut mieux que « Présentation » / « Applications ».</li>
        <li>Les titres de parties et sous-parties sont rédigés, jamais des questions, jamais de simples mots.</li>
        <li>Un <b>chapeau introductif</b> ouvre chaque grande partie (2-3 lignes annonçant les deux sous-parties).</li>
        <li>Une <b>transition</b> ferme chaque partie : elle résume l'acquis et amène la suivante par un lien logique (pas juste « voyons maintenant »).</li>
        <li>Piège classique à éviter : le plan « I. Le principe / II. Les exceptions » quand le sujet appelle une vraie discussion — c'est souvent trop plat pour un concours.</li>
      </ul>
    `)}
    ${methodoCard("3. Le développement — ce qui fait gagner des points", `
      <ul style="margin-left:20px; line-height:1.8;">
        <li><b>Une idée = un paragraphe</b>, avec l'idée énoncée dès la première phrase (pas de suspense).</li>
        <li>Chaque affirmation est justifiée : un principe s'appuie sur un texte, une jurisprudence, ou un raisonnement explicite — jamais une pure affirmation.</li>
        <li>Le devoir doit rester en <b>discussion</b> : présenter aussi les critiques, limites ou débats doctrinaux quand ils existent, pas seulement l'exposé plat du cours.</li>
        <li>Le style reste impersonnel (« on peut soutenir que », « il apparaît que »), pas de « je pense que ».</li>
      </ul>
    `)}
    ${methodoCard("4. La conclusion — facultative, mais si tu la fais...", `
      <p>Une dissertation juridique n'a pas toujours besoin d'une conclusion formelle si le II.B conclut déjà le raisonnement. Si tu en écris une : pas de résumé scolaire, plutôt une ouverture réelle (une évolution en cours, une question laissée ouverte) — jamais une nouvelle idée non démontrée.</p>
    `)}
  `;
}

function renderMethodoCasPratique() {
  return `
    ${methodoCard('Le syllogisme juridique — la seule structure qui compte', `
      <p style="margin-bottom:10px;">Pour <b>chaque problème de droit</b> identifié dans les faits, on répète ce schéma en 4 temps :</p>
      <ol style="margin-left:20px; line-height:1.9;">
        <li><b>Les faits pertinents</b> — reformuler brièvement, sans recopier l'énoncé, en ne gardant que ce qui est juridiquement utile.</li>
        <li><b>Le problème de droit</b> — une question juridique précise, jamais la question « qui a raison ? » posée telle quelle.</li>
        <li><b>La règle de droit (la majeure)</b> — le principe applicable, ses conditions d'application, ses exceptions éventuelles.</li>
        <li><b>L'application aux faits (la mineure)</b> — on confronte chaque condition de la règle aux faits de l'espèce, une par une.</li>
        <li><b>La conclusion</b> — une réponse nette à la question posée, qui découle strictement de la mineure (pas d'affirmation nouvelle).</li>
      </ol>
    `)}
    ${methodoCard('Repérer tous les problèmes de droit', `
      <ul style="margin-left:20px; line-height:1.8;">
        <li>Un cas pratique cache souvent <b>plusieurs</b> questions de droit imbriquées — les traiter dans l'ordre logique (souvent : recevabilité avant le fond, ou question préalable avant question principale).</li>
        <li>Repérer les <b>faits qui ne servent à rien</b> : un bon cas pratique contient parfois des détails-pièges qui n'entrent dans aucune condition légale — ne pas chercher à tout utiliser à tout prix.</li>
        <li>Se méfier des questions <b>fermées implicites</b> : le sujet demande souvent « qui doit obtenir gain de cause », ce qui suppose de qualifier d'abord juridiquement chaque fait.</li>
      </ul>
    `)}
    ${methodoCard('Les pièges classiques', `
      <div style="background:var(--surface-2); padding:12px; border-radius:3px; margin-bottom:8px;">
        <p><b>❌</b> « Rabe a raison. » (conclusion sans démonstration)</p>
        <p><b>✅</b> « Dès lors que les conditions de [notion] sont réunies (i, ii, iii), Rabe est fondé à obtenir [conséquence juridique]. »</p>
      </div>
      <ul style="margin-left:20px; line-height:1.8;">
        <li>Ne jamais commencer par la conclusion — même si la réponse paraît évidente en lisant l'énoncé.</li>
        <li>Ne jamais paraphraser le cours sans l'appliquer aux faits précis de l'espèce.</li>
        <li>Toujours qualifier juridiquement les faits avant de raisonner (un « prêt » n'est pas une « vente », un « préjudice moral » n'est pas un « préjudice matériel »).</li>
      </ul>
    `)}
  `;
}

function renderMethodoSynthese() {
  return `
    ${methodoCard('Objectif de l\'épreuve', `
      <p>Restituer, de façon <b>neutre, structurée et hiérarchisée</b>, le contenu d'un dossier documentaire — sans opinion personnelle, sans information extérieure au dossier, sans recopiage brut des documents.</p>
    `)}
    ${methodoCard('Méthode en 4 temps', `
      <ol style="margin-left:20px; line-height:1.9;">
        <li><b>Lecture active du dossier</b> — repérer pour chaque document : thèse, type (texte de loi, article de presse, rapport, jurisprudence...), date, et degré de fiabilité/poids.</li>
        <li><b>Dégager une problématique de synthèse</b> — la question à laquelle l'ensemble des documents, mis bout à bout, permet de répondre.</li>
        <li><b>Construire un plan qui croise les documents</b> — jamais un plan « document par document ». Chaque partie regroupe les idées convergentes ou opposées de plusieurs documents.</li>
        <li><b>Rédiger sans "je" et sans citer de source explicitement</b> (« un document souligne que... » plutôt que « selon Le Monde du... », sauf consigne contraire) — dans le respect strict du nombre de mots imposé.</li>
      </ol>
    `)}
    ${methodoCard('Erreurs qui coûtent cher', `
      <ul style="margin-left:20px; line-height:1.8;">
        <li>Ajouter une opinion personnelle ou une connaissance extérieure au dossier — c'est hors sujet par principe dans cette épreuve.</li>
        <li>Résumer les documents un par un au lieu de les croiser.</li>
        <li>Dépasser (ou être très en-dessous) du nombre de mots imposé — c'est souvent éliminatoire ou fortement pénalisé.</li>
      </ul>
    `)}
  `;
}

function renderMethodoAccroches() {
  return ACCROCHE_BANK.map(cat => `
    <div class="card" style="margin-bottom:16px;">
      <h4 style="font-family:var(--font-display); font-size:16px; margin-bottom:4px;">${cat.categorie}</h4>
      <p style="font-size:12.5px; color:var(--muted); margin-bottom:10px;">${cat.astuce}</p>
      <ul style="margin-left:20px; line-height:1.9; font-size:13.5px;">
        ${cat.exemples.map(e => `<li>${e}</li>`).join('')}
      </ul>
    </div>
  `).join('') + `
    <div class="card" style="border-color:var(--gold);">
      <p style="font-size:12.5px; color:var(--muted);"><b>Règle d'or :</b> une accroche se démontre en 2-3 phrases maximum, puis se referme sur le sujet. Une accroche qui n'est pas reliée explicitement au sujet fait perdre des points plutôt que d'en gagner. Ces gabarits sont des points de départ à personnaliser avec [tes propres] connaissances vérifiées — jamais à réciter tels quels.</p>
    </div>
  `;
}

function renderMethodoRelecture() {
  const items = [
    "L'introduction contient bien : accroche → contextualisation → définitions → problématique → annonce de plan.",
    "Le plan a 2 parties de longueur équilibrée, chacune avec 2 sous-parties.",
    "Chaque titre de partie est une phrase ou une idée, pas un mot isolé ni une question.",
    "Chaque grande partie a un chapeau d'ouverture et une transition de fermeture.",
    "Aucune affirmation n'est laissée sans justification (texte, jurisprudence, raisonnement).",
    "Le devoir répond réellement à la problématique posée en introduction (pas un hors-sujet progressif).",
    "Le style est impersonnel, sans « je pense », sans familiarité.",
    "L'orthographe et la syntaxe ont été relues au moins une fois, à tête reposée si le temps le permet.",
    "Pour un cas pratique : chaque problème de droit suit le schéma faits → problème → règle → application → conclusion.",
    "Le temps de relecture a été anticipé dans la gestion du temps de l'épreuve (5-10 minutes minimum)."
  ];
  return `
    ${methodoCard('Grille de relecture avant de rendre la copie', `
      <p style="margin-bottom:10px; font-size:13px; color:var(--muted);">À parcourir dans les 5 dernières minutes de l'épreuve — cocher mentalement, pas besoin d'un outil.</p>
      <ul style="margin-left:0; list-style:none; line-height:2.1;">
        ${items.map(i => `<li style="display:flex; gap:10px; align-items:flex-start;"><span style="color:var(--gold); flex-shrink:0;">☐</span><span style="font-size:13.5px;">${i}</span></li>`).join('')}
      </ul>
    `)}
  `;
}

function attachMethodologieEvents() {
  document.querySelectorAll('.methodo-tab').forEach(el => {
    el.addEventListener('click', () => {
      STATE.methodoTab = el.dataset.tab;
      document.getElementById('methodo-content').innerHTML = renderMethodoTab(STATE.methodoTab);
      document.querySelectorAll('.methodo-tab').forEach(t => {
        const active = t.dataset.tab === STATE.methodoTab;
        t.style.borderColor = active ? 'var(--gold)' : '';
        t.style.color = active ? 'var(--gold-bright)' : '';
        t.style.background = active ? 'var(--surface-2)' : '';
      });
    });
  });
}

function renderAlarmes() {
  const reminders = DB.getReminders();
  const jours = ['', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
  const rows = reminders.map(r => `
    <div class="reminder-row">
      <div>
        <div class="reminder-time">${r.heure}</div>
        <div class="reminder-msg">${r.message}</div>
        <div style="font-family:var(--font-mono); font-size:10px; color:var(--muted); margin-top:4px;">${r.jours.map(j => jours[j]).join(' · ')}</div>
      </div>
      <div style="display:flex; align-items:center; gap:14px;">
        <div class="toggle ${r.actif ? 'on' : ''}" data-id="${r.id}"></div>
        <button class="btn btn-danger" style="padding:6px 10px; font-size:11px;" data-del="${r.id}">Suppr.</button>
      </div>
    </div>
  `).join('');

  return `
    <div class="view-header">
      <div class="eyebrow">Module 4 — Discipline de fer</div>
      <h2 class="view-title">Alarmes & notifications</h2>
      <p class="view-sub">Active les notifications du navigateur pour que ça fonctionne réellement.</p>
    </div>
    <button class="btn btn-primary" id="btn-perm" style="margin-bottom:18px;">Activer les notifications</button>
    <div class="card">${rows}</div>
    <div class="card" style="margin-top:16px;">
      <h3 style="font-family:var(--font-display); font-size:15px; margin-bottom:12px;">Ajouter un rappel</h3>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        <input type="time" id="new-time" value="06:30">
        <input type="text" id="new-msg" placeholder="Message du coach..." style="flex:1; min-width:220px;">
        <button class="btn" id="btn-add-reminder">Ajouter</button>
      </div>
    </div>
  `;
}

function attachAlarmesEvents() {
  document.getElementById('btn-perm').addEventListener('click', async () => {
    const res = await REMINDERS.requestPermission();
    if (res === 'granted') { toast('Notifications activées.'); REMINDERS.fire('Test : le système d\'alarme est opérationnel.'); }
    else toast('Notifications refusées.');
  });
  document.querySelectorAll('.toggle').forEach(t => {
    t.addEventListener('click', () => {
      const rem = DB.getReminders().find(r => r.id === t.dataset.id);
      DB.updateReminder(t.dataset.id, { actif: !rem.actif });
      render();
    });
  });
  document.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => { DB.deleteReminder(btn.dataset.del); render(); });
  });
  document.getElementById('btn-add-reminder').addEventListener('click', () => {
    const heure = document.getElementById('new-time').value;
    const msg = document.getElementById('new-msg').value.trim();
    if (!heure || !msg) { toast('Heure et message obligatoires.'); return; }
    DB.addReminder({ heure, jours: [1,2,3,4,5,6,7], message: msg });
    toast('Rappel ajouté.');
    render();
  });
}

// ================================================================
// INIT
// ================================================================
document.addEventListener('DOMContentLoaded', () => {
  DB.seedIfEmpty();
  THEME.init();

  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => setView(item.dataset.view));
  });

  const themeBtn = document.getElementById('btn-theme-toggle');
  if (themeBtn) themeBtn.addEventListener('click', () => THEME.toggle());

  // Certains navigateurs chargent la liste des voix de façon asynchrone.
  if (VOICE.supported && typeof speechSynthesis.onvoiceschanged !== 'undefined') {
    speechSynthesis.onvoiceschanged = () => {};
  }
  window.addEventListener('beforeunload', () => VOICE.stop());

  REMINDERS.start();
  render();
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
}
</script>
